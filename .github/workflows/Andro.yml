name: Build Andoco APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true

      - name: Clone termux-generator
        run: |
          git clone https://github.com/robertkirkman/termux-generator.git
          cd termux-generator
          chmod +x build-termux.sh

      - name: Generate Termux Source with Custom Package Name
        run: |
          cd termux-generator
          # 完全交由脚本自行管理所有依赖仓库的克隆
          ./build-termux.sh \
            --name com.andoco.app \
            --architectures aarch64 \
            --dirty \
            --disable-bootstrap \
            --disable-x11 \
            --disable-gui \
            --disable-api \
            --disable-boot \
            --disable-widget \
            --disable-float \
            --disable-tasker \
            --disable-styling

      - name: Locate Generated Termux Source
        id: find-src
        run: |
          cd termux-generator
          # 脚本运行完毕后，生成的项目通常位于当前目录下的 termux-app 文件夹
          TERMUX_SRC="termux-app"
          if [ ! -d "$TERMUX_SRC" ]; then
            echo "Termux source directory not found at expected path: $TERMUX_SRC"
            # 如果默认路径没有，则搜索一下，以防脚本更改了输出位置
            TERMUX_SRC=$(find . -maxdepth 2 -type d -name "termux-app" | head -1)
          fi
          if [ -z "$TERMUX_SRC" ]; then
            echo "Could not locate generated Termux source."
            exit 1
          fi
          echo "TERMUX_SRC=$TERMUX_SRC" >> $GITHUB_ENV
          echo "Found Termux source at: $TERMUX_SRC"

      - name: Inject WebView Capability
        run: |
          SRC="$TERMUX_SRC"
          
          # 1. 创建 WebViewActivity.java
          PKG_PATH="$SRC/app/src/main/java/com/andoco/app"
          mkdir -p "$PKG_PATH/webview"
          cat > "$PKG_PATH/webview/WebViewActivity.java" << 'EOF'
          package com.andoco.app.webview;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          public class WebViewActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView webView = new WebView(this);
                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.getSettings().setDomStorageEnabled(true);
                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("http://127.0.0.1:4096");
                  setContentView(webView);
                  Toast.makeText(this, "Connecting to OpenCode...", Toast.LENGTH_SHORT).show();
              }
          }
          EOF

          # 2. 在 Manifest 中注册 Activity 并允许 Cleartext
          MANIFEST="$SRC/app/src/main/AndroidManifest.xml"
          sed -i 's/<application /<application android:usesCleartextTraffic="true" /' "$MANIFEST"
          sed -i 's/<\/application>/<activity android:name=".webview.WebViewActivity" android:exported="true" \/>\n<\/application>/' "$MANIFEST"

          # 3. 在菜单中添加 "OpenCode Web" 选项
          MENU_FILE="$SRC/app/src/main/res/menu/main.xml"
          if [ -f "$MENU_FILE" ]; then
            sed -i 's/<\/menu>/<item android:id="@+id\/action_webview" android:title="OpenCode Web" android:showAsAction="never" \/>\n<\/menu>/' "$MENU_FILE"
          fi

          # 4. 在 TermuxActivity 中处理菜单点击事件
          ACTIVITY_FILE="$SRC/app/src/main/java/com/termux/app/TermuxActivity.java"
          if [ -f "$ACTIVITY_FILE" ]; then
            sed -i 's/import android.os.Bundle;/import android.os.Bundle;\nimport com.andoco.app.webview.WebViewActivity;/' "$ACTIVITY_FILE"
            sed -i 's/public boolean onMenuItemClick(MenuItem item) {/public boolean onMenuItemClick(MenuItem item) {\n        if (item.getItemId() == R.id.action_webview) {\n            startActivity(new Intent(this, WebViewActivity.class));\n            return true;\n        }/' "$ACTIVITY_FILE"
          fi

      - name: Build Debug APK
        run: |
          cd "$TERMUX_SRC"
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Andoco-Debug-APK
          path: termux-generator/termux-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error