name: Build Andoco APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # مرحله حیاتی: تأیید خودکار لایسنس‌ها با دستور yes
      - name: Accept Android SDK Licenses Automatically
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # نصب پکیج‌های ضروری اندروید (نسخه ۳۴)
      - name: Install Required Android SDK Packages
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Clone and Prepare termux-generator
        run: |
          git clone https://github.com/robertkirkman/termux-generator.git
          cd termux-generator
          chmod +x build-termux.sh

      - name: Generate Termux Source with Custom Package Name
        run: |
          cd termux-generator
          # ساختن سورس با پکیج نیم اختصاصی
          ./build-termux.sh --name com.andoco.app --architectures aarch64 --dirty

      - name: Locate Termux Source
        id: find-src
        run: |
          cd termux-generator
          TERMUX_SRC=$(find . -maxdepth 3 -type d -name "termux-app" | head -1)
          if [ -z "$TERMUX_SRC" ]; then
            echo "Termux source directory not found!"
            exit 1
          fi
          echo "TERMUX_SRC=$TERMUX_SRC" >> $GITHUB_ENV
          echo "Found source at: $TERMUX_SRC"

      - name: Inject WebView Capability
        run: |
          cd termux-generator
          SRC="$TERMUX_SRC"
          
          # ۱. ساخت مسیر پکیج و فایل WebViewActivity.java
          PKG_PATH="$SRC/app/src/main/java/com/andoco/app"
          mkdir -p "$PKG_PATH/webview"
          cat > "$PKG_PATH/webview/WebViewActivity.java" << 'EOF'
          package com.andoco.app.webview;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          public class WebViewActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView webView = new WebView(this);
                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.getSettings().setDomStorageEnabled(true);
                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("http://127.0.0.1:4096");
                  setContentView(webView);
                  Toast.makeText(this, "Connecting to OpenCode...", Toast.LENGTH_SHORT).show();
              }
          }
          EOF

          # ۲. ثبت اکتیویتی در Manifest و فعال‌سازی Cleartext Traffic
          MANIFEST="$SRC/app/src/main/AndroidManifest.xml"
          sed -i 's/<application /<application android:usesCleartextTraffic="true" /' "$MANIFEST"
          sed -i 's/<\/application>/<activity android:name=".webview.WebViewActivity" android:exported="true" \/>\n<\/application>/' "$MANIFEST"

          # ۳. اضافه کردن دکمه به منوی ترموکس (menus/main.xml)
          MENU_FILE="$SRC/app/src/main/res/menu/main.xml"
          if [ -f "$MENU_FILE" ]; then
            sed -i 's/<\/menu>/<item android:id="@+id\/action_webview" android:title="OpenCode Web" android:showAsAction="never" \/>\n<\/menu>/' "$MENU_FILE"
          fi

          # ۴. پیدا کردن TermuxActivity و اضافه کردن منطق کلیک
          ACTIVITY_FILE=$(find "$SRC" -name "TermuxActivity.java" | head -1)
          if [ -f "$ACTIVITY_FILE" ]; then
            sed -i 's/import android.os.Bundle;/import android.os.Bundle;\nimport com.andoco.app.webview.WebViewActivity;/' "$ACTIVITY_FILE"
            sed -i 's/public boolean onMenuItemClick(MenuItem item) {/public boolean onMenuItemClick(MenuItem item) {\n        if (item.getItemId() == R.id.action_webview) {\n            startActivity(new Intent(this, WebViewActivity.class));\n            return true;\n        }/' "$ACTIVITY_FILE"
          fi

      - name: Build Debug APK
        run: |
          cd termux-generator
          cd "$TERMUX_SRC"
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Andoco-Debug-APK
          path: termux-generator/termux-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error