name: AI API Server with Cloudflare Tunnel (Windows)

on:
  workflow_dispatch:
    inputs:
      session_minutes:
        description: 'مدت زمان اجرا (دقیقه)'
        required: true
        default: '120'

jobs:
  ai-api:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: دریافت کد مخزن
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: نصب Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: نصب وابستگی‌ها
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install g4f fastapi uvicorn pydantic

      - name: یافتن مسیر Chrome یا Edge
        id: find-browser
        shell: pwsh
        run: |
          $paths = @(
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
            "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe",
            "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe",
            "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe"
          )
          $browserPath = $paths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $browserPath) {
            $browserPath = (Get-Command chrome.exe -ErrorAction SilentlyContinue).Source
          }
          if (-not $browserPath) {
            $browserPath = (Get-Command msedge.exe -ErrorAction SilentlyContinue).Source
          }
          if (-not $browserPath) {
            Write-Error "هیچ مرورگری یافت نشد"
            exit 1
          }
          Write-Host "Browser path: $browserPath"
          "BROWSER_PATH=$browserPath" >> $env:GITHUB_ENV
          $env:BROWSER_PATH = $browserPath

      - name: نوشتن سرور AI API
        shell: pwsh
        run: |
          $content = @'
          import os
          import json
          import time
          import secrets
          import warnings
          import traceback
          import shutil
          from typing import List, Optional, Dict, Any

          import g4f
          from fastapi import FastAPI, Depends, HTTPException, Header
          from fastapi.responses import JSONResponse
          from pydantic import BaseModel
          import uvicorn

          # تنظیم مسیر مرورگر برای g4f
          try:
              from g4f.cookies import BrowserConfig
              browser_path = os.environ.get("BROWSER_PATH")
              if browser_path and os.path.exists(browser_path):
                  BrowserConfig.executable_path = browser_path
                  print(f"✅ Browser path set to: {browser_path}")
              else:
                  print("⚠️ مرورگر یافت نشد، از مسیر پیش‌فرض استفاده می‌شود")
          except ImportError:
              pass

          g4f.debug.logging = False
          warnings.filterwarnings("ignore", category=UserWarning)
          warnings.filterwarnings("ignore", category=RuntimeWarning)

          app = FastAPI(
              title="AI Chat API with Tool Calling",
              description="API for chat with AI using g4f and DeepInfra, with support for function calling.",
              version="1.0.0"
          )

          from fastapi.middleware.cors import CORSMiddleware
          app.add_middleware(
              CORSMiddleware,
              allow_origins=["*"],
              allow_credentials=True,
              allow_methods=["*"],
              allow_headers=["*"],
          )

          MODEL_NAME = "zai-org/GLM-5.2"
          PROVIDER = g4f.Provider.DeepInfra

          API_KEY = os.getenv("RDP_PASSWORD")
          if not API_KEY:
              raise RuntimeError(
                  "Environment variable RDP_PASSWORD is not set. "
                  "Please set it before running the server."
              )

          def verify_api_key(api_key: str) -> bool:
              return secrets.compare_digest(api_key, API_KEY)

          class Message(BaseModel):
              role: str
              content: Optional[str] = None
              tool_calls: Optional[List[Dict[str, Any]]] = None
              tool_call_id: Optional[str] = None

          class ToolFunction(BaseModel):
              name: str
              description: str
              parameters: Dict[str, Any]

          class Tool(BaseModel):
              type: str = "function"
              function: ToolFunction

          class ChatCompletionRequest(BaseModel):
              messages: List[Message]
              tools: Optional[List[Tool]] = None
              temperature: Optional[float] = None
              max_tokens: Optional[int] = None
              top_p: Optional[float] = None

          class ChatCompletionResponse(BaseModel):
              id: str
              object: str
              created: int
              model: str
              choices: List[Dict[str, Any]]
              usage: Optional[Dict[str, int]] = None

          async def get_api_key(x_api_key: str = Header(..., alias="X-API-Key")):
              if not verify_api_key(x_api_key):
                  raise HTTPException(status_code=401, detail="Invalid API key")
              return x_api_key

          def convert_g4f_response(g4f_response, model_name: str) -> Dict[str, Any]:
              message = g4f_response.choices[0].message
              content = getattr(message, 'content', None)
              tool_calls_raw = getattr(message, 'tool_calls', None)

              tool_calls = None
              if tool_calls_raw:
                  tool_calls = []
                  for tc in tool_calls_raw:
                      tool_calls.append({
                          "id": tc.id,
                          "type": "function",
                          "function": {
                              "name": tc.function.name,
                              "arguments": tc.function.arguments
                          }
                      })

              finish_reason = "tool_calls" if tool_calls else "stop"

              return {
                  "id": getattr(g4f_response, 'id', f"chatcmpl-{int(time.time())}"),
                  "object": "chat.completion",
                  "created": int(time.time()),
                  "model": model_name,
                  "choices": [
                      {
                          "index": 0,
                          "message": {
                              "role": "assistant",
                              "content": content,
                              "tool_calls": tool_calls
                          },
                          "finish_reason": finish_reason
                      }
                  ],
                  "usage": getattr(g4f_response, 'usage', None)
              }

          # هندلر سراسری برای خطاهای پیش‌بینی‌نشده
          @app.exception_handler(Exception)
          async def unhandled_exception_handler(request, exc):
              tb = traceback.format_exc()
              return JSONResponse(
                  status_code=500,
                  content={
                      "detail": {
                          "error": str(exc),
                          "type": type(exc).__name__,
                          "traceback": tb,
                      }
                  },
              )

          @app.post("/v1/chat/completions", response_model=ChatCompletionResponse)
          async def chat_completions(
              request: ChatCompletionRequest,
              api_key: str = Depends(get_api_key)
          ):
              messages = []
              for msg in request.messages:
                  msg_dict = {"role": msg.role, "content": msg.content}
                  if msg.tool_calls is not None:
                      msg_dict["tool_calls"] = msg.tool_calls
                  if msg.tool_call_id is not None:
                      msg_dict["tool_call_id"] = msg.tool_call_id
                  messages.append(msg_dict)

              tools = None
              if request.tools:
                  tools = [tool.dict() for tool in request.tools]

              params = {
                  "model": MODEL_NAME,
                  "messages": messages,
                  "provider": PROVIDER,
                  "stream": False,
              }
              if tools:
                  params["tools"] = tools
                  params["tool_choice"] = "auto"
              if request.temperature is not None:
                  params["temperature"] = request.temperature
              if request.max_tokens is not None:
                  params["max_tokens"] = request.max_tokens
              if request.top_p is not None:
                  params["top_p"] = request.top_p

              try:
                  client = g4f.Client()
                  response = client.chat.completions.create(**params)
                  return convert_g4f_response(response, MODEL_NAME)
              except Exception as e:
                  tb = traceback.format_exc()
                  print(tb)
                  raise HTTPException(
                      status_code=500,
                      detail={
                          "error": str(e),
                          "type": type(e).__name__,
                          "traceback": tb,
                      }
                  )

          @app.get("/health")
          async def health():
              return {"status": "ok"}

          @app.get("/api/status")
          async def api_status(api_key: str = Depends(get_api_key)):
              return {"status": "ok", "model": MODEL_NAME}

          @app.get("/v1/models")
          async def list_models(api_key: str = Depends(get_api_key)):
              return {
                  "object": "list",
                  "data": [
                      {
                          "id": MODEL_NAME,
                          "object": "model",
                          "created": int(time.time()),
                          "owned_by": "DeepInfra"
                      }
                  ]
              }

          if __name__ == "__main__":
              uvicorn.run(app, host="0.0.0.0", port=5000)
          '@
          Set-Content -Path api_server.py -Value $content -Encoding UTF8

      - name: راه‌اندازی سرور API
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
          BROWSER_PATH: ${{ env.BROWSER_PATH }}
        run: |
          if ([string]::IsNullOrEmpty($env:RDP_PASSWORD)) {
            Write-Error "لطفاً RDP_PASSWORD را در Secrets مخزن تعریف کنید."
            exit 1
          }
          $env:SESSION_MINUTES = "${{ github.event.inputs.session_minutes }}"
          Write-Host "Using browser: $env:BROWSER_PATH"
          Start-Process -FilePath "python" -ArgumentList "api_server.py" -WorkingDirectory $PWD -RedirectStandardOutput "api_server.log" -RedirectStandardError "api_server.err" -NoNewWindow
          Start-Sleep -Seconds 8

          # انتظار برای آماده شدن سرور
          $healthy = $false
          for ($i = 0; $i -lt 30; $i++) {
            try {
              $response = Invoke-WebRequest -Uri "http://localhost:5000/health" -UseBasicParsing -TimeoutSec 2
              if ($response.StatusCode -eq 200) {
                $healthy = $true
                Write-Host "✅ سرور سالم است"
                break
              }
            } catch {}
            Start-Sleep -Seconds 1
          }
          if (-not $healthy) {
            Write-Host "❌ سرور API بالا نیامد"
            Get-Content api_server.log -ErrorAction SilentlyContinue
            Get-Content api_server.err -ErrorAction SilentlyContinue
            exit 1
          }

      - name: راه‌اندازی اولیه تونل Cloudflare
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile "cloudflared.exe"

          Write-Host "🌐 راه‌اندازی تونل Cloudflare..."
          Start-Process -FilePath "$PWD\cloudflared.exe" -ArgumentList "tunnel --url http://localhost:5000 --no-autoupdate" -RedirectStandardOutput "cloudflare.log" -RedirectStandardError "cloudflare.err" -NoNewWindow
          Start-Sleep -Seconds 5

          $TIMEOUT = 60
          $START_TIME = Get-Date
          $TUNNEL_URL = $null
          while ($true) {
            if (-not (Get-Process cloudflared -ErrorAction SilentlyContinue)) {
              Write-Host "⛔ cloudflared از کار افتاد"
              Get-Content cloudflare.log -ErrorAction SilentlyContinue
              Get-Content cloudflare.err -ErrorAction SilentlyContinue
              exit 1
            }
            $match = Select-String -Path "cloudflare.log","cloudflare.err" -Pattern 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' | Select-Object -First 1
            if ($match) {
              $TUNNEL_URL = $match.Matches[0].Value
              Write-Host "✅ تونل ساخته شد: $TUNNEL_URL"
              break
            }
            if ((Get-Date) - $START_TIME -ge [TimeSpan]::FromSeconds($TIMEOUT)) {
              Write-Host "❌ تونل در زمان مقرر ساخته نشد"
              Get-Content cloudflare.log -ErrorAction SilentlyContinue
              Get-Content cloudflare.err -ErrorAction SilentlyContinue
              exit 1
            }
            Start-Sleep -Seconds 2
          }
          "TUNNEL_URL=$TUNNEL_URL" >> $env:GITHUB_ENV
          $env:TUNNEL_URL = $TUNNEL_URL

      - name: به‌روزرسانی README با لینک اولیه
        shell: pwsh
        run: |
          $BRANCH = git rev-parse --abbrev-ref HEAD
          git remote set-url origin "https://x-access-token:$env:GITHUB_TOKEN@github.com/$env:GITHUB_REPOSITORY.git"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          Set-Content -Path README.md -Value $env:TUNNEL_URL
          git add README.md
          git commit -m "🔗 لینک API [skip ci]" --allow-empty
          git pull --rebase --autostash origin "$BRANCH"
          git push origin HEAD:"$BRANCH"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: زنده نگه‌داشتن نشست و نگهبانی تونل
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $DURATION = [int]${{ github.event.inputs.session_minutes }}
          $END_TIME = (Get-Date).AddMinutes($DURATION)
          $TUNNEL_URL = $env:TUNNEL_URL
          $BRANCH = git rev-parse --abbrev-ref HEAD

          git remote set-url origin "https://x-access-token:$env:GITHUB_TOKEN@github.com/$env:GITHUB_REPOSITORY.git"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          Write-Host "⏳ سرور تا $DURATION دقیقه فعال خواهد ماند (شاخه: $BRANCH)"
          Start-Sleep -Seconds 10

          while ((Get-Date) -lt $END_TIME) {
            $remaining = $END_TIME - (Get-Date)
            Write-Host "[$(Get-Date -Format 'HH:mm:ss')] زمان باقی‌مانده: $([math]::Floor($remaining.TotalMinutes)) دقیقه"

            # بررسی سلامت سرور محلی
            try {
              $localResponse = Invoke-WebRequest -Uri "http://localhost:5000/health" -UseBasicParsing -TimeoutSec 5
              $localCode = $localResponse.StatusCode
            } catch {
              $localCode = 0
            }
            if ($localCode -ne 200) {
              Write-Host "❌ سرور محلی پاسخ نمی‌دهد - راه‌اندازی مجدد API server..."
              Get-Process python -ErrorAction SilentlyContinue | Stop-Process -Force
              Start-Sleep -Seconds 2
              $env:BROWSER_PATH = "${{ env.BROWSER_PATH }}"
              $env:RDP_PASSWORD = "${{ secrets.RDP_PASSWORD }}"
              Start-Process -FilePath "python" -ArgumentList "api_server.py" -WorkingDirectory $PWD -RedirectStandardOutput "api_server.log" -RedirectStandardError "api_server.err" -NoNewWindow
              Start-Sleep -Seconds 5
            }

            # بررسی سلامت تونل از بیرون
            try {
              $tunnelResponse = Invoke-WebRequest -Uri "$TUNNEL_URL/health" -UseBasicParsing -TimeoutSec 5
              $tunnelCode = $tunnelResponse.StatusCode
            } catch {
              $tunnelCode = 0
            }
            if ($tunnelCode -ne 200) {
              Write-Host "❌ تونل پاسخ نمی‌دهد (کد $tunnelCode) - راه‌اندازی مجدد..."
              Get-Process cloudflared -ErrorAction SilentlyContinue | Stop-Process -Force
              Start-Sleep -Seconds 2
              Start-Process -FilePath "$PWD\cloudflared.exe" -ArgumentList "tunnel --url http://localhost:5000 --no-autoupdate" -RedirectStandardOutput "cloudflare.log" -RedirectStandardError "cloudflare.err" -NoNewWindow
              Start-Sleep -Seconds 8

              $match = Select-String -Path "cloudflare.log","cloudflare.err" -Pattern 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' | Select-Object -First 1
              if ($match) {
                $NEW_URL = $match.Matches[0].Value
                Write-Host "✅ آدرس جدید: $NEW_URL"
                if ($NEW_URL -ne $TUNNEL_URL) {
                  $TUNNEL_URL = $NEW_URL
                  Set-Content -Path README.md -Value $TUNNEL_URL
                  git add README.md
                  git commit -m "🔄 به‌روزرسانی لینک تونل [skip ci]" --allow-empty
                  git pull --rebase --autostash origin "$BRANCH"
                  git push origin HEAD:"$BRANCH"
                }
              } else {
                Write-Host "⚠️ نتوانستیم آدرس جدید را از لاگ بخوانیم"
              }
            } else {
              # یک درخواست ساده برای فعال نگه‌داشتن تونل
              try { Invoke-WebRequest -Uri "$TUNNEL_URL/health" -UseBasicParsing -TimeoutSec 5 | Out-Null } catch {}
            }

            Start-Sleep -Seconds 30
          }
          Write-Host "زمان به پایان رسید."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
          BROWSER_PATH: ${{ env.BROWSER_PATH }}

      - name: کامیت تغییرات نهایی (در صورت وجود)
        if: always()
        shell: pwsh
        run: |
          $BRANCH = git rev-parse --abbrev-ref HEAD
          git remote set-url origin "https://x-access-token:$env:GITHUB_TOKEN@github.com/$env:GITHUB_REPOSITORY.git"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A -- . ':!api_server.py' ':!cloudflared.exe' ':!cloudflare.log' ':!cloudflare.err' ':!api_server.log' ':!api_server.err'

          if (git diff --cached --quiet) {
            Write-Host "بدون تغییر"
          } else {
            git commit -m "💾 ذخیره تغییرات [skip ci]" --allow-empty
            git pull --rebase --autostash origin "$BRANCH"
            git push origin HEAD:"$BRANCH"
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}