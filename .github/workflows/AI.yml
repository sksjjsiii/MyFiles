name: AI API Server with Cloudflare Tunnel (Ubuntu)

on:
  workflow_dispatch:
    inputs:
      session_minutes:
        description: 'مدت زمان اجرا (دقیقه)'
        required: true
        default: '120'

jobs:
  ai-api:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: دریافت کد مخزن
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: نصب گوگل کروم
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: آماده‌سازی اسکریپت wrapper برای Chrome
        run: |
          CHROME_BIN="${{ steps.setup-chrome.outputs.chrome-path }}"
          WRAPPER="$RUNNER_TEMP/chrome-wrapper.sh"
          # با استفاده از heredoc بدون کوتیشن تا متغیر CHROME_BIN جایگزین شود
          cat > "$WRAPPER" << EOF
          #!/bin/bash
          exec "$CHROME_BIN" --no-sandbox --disable-gpu --disable-dev-shm-usage "\$@"
          EOF
          chmod +x "$WRAPPER"
          echo "CHROME_WRAPPER=$WRAPPER" >> $GITHUB_ENV
          echo "✅ Chrome wrapper created at $WRAPPER"

      - name: نصب Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: نصب وابستگی‌ها
        run: |
          python -m pip install --upgrade pip
          pip install g4f fastapi uvicorn pydantic

      - name: نوشتن سرور AI API
        run: |
          cat << 'PYEOF' > api_server.py
          import os
          import json
          import time
          import secrets
          import warnings
          import traceback
          import shutil
          from typing import List, Optional, Dict, Any

          import g4f
          from fastapi import FastAPI, Depends, HTTPException, Header
          from fastapi.responses import JSONResponse
          from pydantic import BaseModel
          import uvicorn

          # تنظیم مسیر Chrome برای g4f
          try:
              from g4f.cookies import BrowserConfig
              chrome_path = os.environ.get("CHROME_PATH")
              if chrome_path and os.path.exists(chrome_path):
                  BrowserConfig.executable_path = chrome_path
                  print(f"✅ Chrome path set to: {chrome_path}")
              else:
                  print(f"⚠️ Chrome path not found: {chrome_path}")
          except ImportError:
              pass

          g4f.debug.logging = False
          warnings.filterwarnings("ignore", category=UserWarning)
          warnings.filterwarnings("ignore", category=RuntimeWarning)

          app = FastAPI(
              title="AI Chat API with Tool Calling",
              description="API for chat with AI using g4f and DeepInfra, with support for function calling.",
              version="1.0.0"
          )

          from fastapi.middleware.cors import CORSMiddleware
          app.add_middleware(
              CORSMiddleware,
              allow_origins=["*"],
              allow_credentials=True,
              allow_methods=["*"],
              allow_headers=["*"],
          )

          MODEL_NAME = "zai-org/GLM-5.2"
          PROVIDER = g4f.Provider.DeepInfra

          API_KEY = os.getenv("RDP_PASSWORD")
          if not API_KEY:
              raise RuntimeError(
                  "Environment variable RDP_PASSWORD is not set. "
                  "Please set it before running the server."
              )

          def verify_api_key(api_key: str) -> bool:
              return secrets.compare_digest(api_key, API_KEY)

          class Message(BaseModel):
              role: str
              content: Optional[str] = None
              tool_calls: Optional[List[Dict[str, Any]]] = None
              tool_call_id: Optional[str] = None

          class ToolFunction(BaseModel):
              name: str
              description: str
              parameters: Dict[str, Any]

          class Tool(BaseModel):
              type: str = "function"
              function: ToolFunction

          class ChatCompletionRequest(BaseModel):
              messages: List[Message]
              tools: Optional[List[Tool]] = None
              temperature: Optional[float] = None
              max_tokens: Optional[int] = None
              top_p: Optional[float] = None

          class ChatCompletionResponse(BaseModel):
              id: str
              object: str
              created: int
              model: str
              choices: List[Dict[str, Any]]
              usage: Optional[Dict[str, int]] = None

          async def get_api_key(x_api_key: str = Header(..., alias="X-API-Key")):
              if not verify_api_key(x_api_key):
                  raise HTTPException(status_code=401, detail="Invalid API key")
              return x_api_key

          def convert_g4f_response(g4f_response, model_name: str) -> Dict[str, Any]:
              message = g4f_response.choices[0].message
              content = getattr(message, 'content', None)
              tool_calls_raw = getattr(message, 'tool_calls', None)

              tool_calls = None
              if tool_calls_raw:
                  tool_calls = []
                  for tc in tool_calls_raw:
                      tool_calls.append({
                          "id": tc.id,
                          "type": "function",
                          "function": {
                              "name": tc.function.name,
                              "arguments": tc.function.arguments
                          }
                      })

              finish_reason = "tool_calls" if tool_calls else "stop"

              return {
                  "id": getattr(g4f_response, 'id', f"chatcmpl-{int(time.time())}"),
                  "object": "chat.completion",
                  "created": int(time.time()),
                  "model": model_name,
                  "choices": [
                      {
                          "index": 0,
                          "message": {
                              "role": "assistant",
                              "content": content,
                              "tool_calls": tool_calls
                          },
                          "finish_reason": finish_reason
                      }
                  ],
                  "usage": getattr(g4f_response, 'usage', None)
              }

          # هندلر سراسری برای خطاهای پیش‌بینی‌نشده
          @app.exception_handler(Exception)
          async def unhandled_exception_handler(request, exc):
              tb = traceback.format_exc()
              return JSONResponse(
                  status_code=500,
                  content={
                      "detail": {
                          "error": str(exc),
                          "type": type(exc).__name__,
                          "traceback": tb,
                      }
                  },
              )

          @app.post("/v1/chat/completions", response_model=ChatCompletionResponse)
          async def chat_completions(
              request: ChatCompletionRequest,
              api_key: str = Depends(get_api_key)
          ):
              messages = []
              for msg in request.messages:
                  msg_dict = {"role": msg.role, "content": msg.content}
                  if msg.tool_calls is not None:
                      msg_dict["tool_calls"] = msg.tool_calls
                  if msg.tool_call_id is not None:
                      msg_dict["tool_call_id"] = msg.tool_call_id
                  messages.append(msg_dict)

              tools = None
              if request.tools:
                  tools = [tool.dict() for tool in request.tools]

              params = {
                  "model": MODEL_NAME,
                  "messages": messages,
                  "provider": PROVIDER,
                  "stream": False,
              }
              if tools:
                  params["tools"] = tools
                  params["tool_choice"] = "auto"
              if request.temperature is not None:
                  params["temperature"] = request.temperature
              if request.max_tokens is not None:
                  params["max_tokens"] = request.max_tokens
              if request.top_p is not None:
                  params["top_p"] = request.top_p

              try:
                  client = g4f.Client()
                  response = client.chat.completions.create(**params)
                  return convert_g4f_response(response, MODEL_NAME)
              except Exception as e:
                  tb = traceback.format_exc()
                  print(tb)
                  raise HTTPException(
                      status_code=500,
                      detail={
                          "error": str(e),
                          "type": type(e).__name__,
                          "traceback": tb,
                      }
                  )

          @app.get("/health")
          async def health():
              return {"status": "ok"}

          @app.get("/api/status")
          async def api_status(api_key: str = Depends(get_api_key)):
              return {"status": "ok", "model": MODEL_NAME}

          @app.get("/v1/models")
          async def list_models(api_key: str = Depends(get_api_key)):
              return {
                  "object": "list",
                  "data": [
                      {
                          "id": MODEL_NAME,
                          "object": "model",
                          "created": int(time.time()),
                          "owned_by": "DeepInfra"
                      }
                  ]
              }

          if __name__ == "__main__":
              uvicorn.run(app, host="0.0.0.0", port=5000)
          PYEOF

      - name: راه‌اندازی سرور API
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
          CHROME_PATH: ${{ env.CHROME_WRAPPER }}
        run: |
          if [ -z "$RDP_PASSWORD" ]; then
            echo "::error::لطفاً RDP_PASSWORD را در Secrets مخزن تعریف کنید."
            exit 1
          fi
          export RDP_PASSWORD="$RDP_PASSWORD"
          export CHROME_PATH="$CHROME_PATH"
          export SESSION_MINUTES="${{ github.event.inputs.session_minutes }}"
          echo "Using Chrome wrapper: $CHROME_PATH"
          nohup python3 api_server.py > api_server.log 2>&1 &
          echo "سرور AI API روی پورت 5000 اجرا شد"

          # انتظار برای آماده شدن سرور
          for i in {1..30}; do
            if curl -s http://localhost:5000/health | grep -q '"status":"ok"'; then
              echo "✅ سرور سالم است"
              break
            fi
            sleep 1
          done

          if ! curl -s http://localhost:5000/health >/dev/null; then
            echo "❌ سرور API بالا نیامد"
            cat api_server.log
            exit 1
          fi

      - name: راه‌اندازی اولیه تونل Cloudflare
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared

          echo "🌐 راه‌اندازی تونل Cloudflare..."
          cloudflared tunnel --url http://localhost:5000 --no-autoupdate > cloudflare.log 2>&1 &
          sleep 5

          TIMEOUT=60
          START_TIME=$(date +%s)
          while true; do
            if ! pgrep cloudflared > /dev/null; then
              echo "⛔ cloudflared از کار افتاد"
              cat cloudflare.log
              exit 1
            fi
            if grep -q 'trycloudflare\.com' cloudflare.log; then
              TUNNEL_URL=$(grep -oP 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' cloudflare.log | head -n1)
              if [ -n "$TUNNEL_URL" ]; then
                echo "✅ تونل ساخته شد: $TUNNEL_URL"
                break
              fi
            fi
            if [ $(( $(date +%s) - START_TIME )) -ge $TIMEOUT ]; then
              echo "❌ تونل در زمان مقرر ساخته نشد"
              cat cloudflare.log
              exit 1
            fi
            sleep 2
          done

          echo "TUNNEL_URL=$TUNNEL_URL" >> $GITHUB_ENV

      - name: به‌روزرسانی README با لینک اولیه
        run: |
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "${{ env.TUNNEL_URL }}" > README.md
          git add README.md
          git commit -m "🔗 لینک API [skip ci]" || true
          git pull --rebase --autostash origin "$BRANCH" && git push origin HEAD:"$BRANCH" || echo "⚠️ push اولیه ناموفق (در ادامه دوباره تلاش می‌شود)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: زنده نگه‌داشتن نشست و نگهبانی تونل
        run: |
          set +e

          DURATION=${{ github.event.inputs.session_minutes }}
          END_TIME=$(date -d "$DURATION minutes" +%s)
          TUNNEL_URL="${{ env.TUNNEL_URL }}"
          BRANCH=$(git rev-parse --abbrev-ref HEAD)

          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "⏳ سرور تا $DURATION دقیقه فعال خواهد ماند (شاخه: $BRANCH)"

          sleep 10

          while [ $(date +%s) -lt $END_TIME ]; do
            REMAINING=$((END_TIME - $(date +%s)))
            echo "[$(date +%H:%M:%S)] زمان باقی‌مانده: $((REMAINING/60)) دقیقه"

            # بررسی سلامت سرور محلی
            LOCAL_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/health 2>/dev/null || echo "000")
            if [ "$LOCAL_CODE" != "200" ]; then
              echo "❌ سرور محلی پاسخ نمی‌دهد - راه‌اندازی مجدد API server..."
              pkill -f api_server.py || true
              sleep 2
              export RDP_PASSWORD="$RDP_PASSWORD"
              export CHROME_PATH="$CHROME_PATH"
              nohup python3 api_server.py > api_server.log 2>&1 &
              sleep 5
            fi

            # بررسی سلامت تونل
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 5 "$TUNNEL_URL/health" 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" != "200" ]; then
              echo "❌ تونل پاسخ نمی‌دهد (کد $HTTP_CODE) - راه‌اندازی مجدد..."

              pkill cloudflared || true
              sleep 2
              cloudflared tunnel --url http://localhost:5000 --no-autoupdate > cloudflare.log 2>&1 &
              sleep 8

              NEW_URL=$(grep -oP 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' cloudflare.log | head -n1)
              if [ -n "$NEW_URL" ]; then
                echo "✅ آدرس جدید: $NEW_URL"
                if [ "$NEW_URL" != "$TUNNEL_URL" ]; then
                  TUNNEL_URL=$NEW_URL
                  echo "$NEW_URL" > README.md
                  git add README.md
                  git commit -m "🔄 به‌روزرسانی لینک تونل [skip ci]" || true
                  git pull --rebase --autostash origin "$BRANCH" && git push origin HEAD:"$BRANCH" || echo "⚠️ push لینک جدید ناموفق"
                fi
              else
                echo "⚠️ نتوانستیم آدرس جدید را از لاگ بخوانیم"
              fi
            else
              curl -s -o /dev/null "$TUNNEL_URL/health" 2>/dev/null || true
            fi

            sleep 30
          done
          echo "زمان به پایان رسید."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
          CHROME_PATH: ${{ env.CHROME_WRAPPER }}

      - name: کامیت تغییرات نهایی (در صورت وجود)
        if: always()
        run: |
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A -- . ':!api_server.py' ':!cloudflared' ':!cloudflare.log' ':!api_server.log'

          if git diff --cached --quiet; then
            echo "بدون تغییر"
          else
            git commit -m "💾 ذخیره تغییرات [skip ci]" || echo "⚠️ commit ناموفق"
            git pull --rebase --autostash origin "$BRANCH" && git push origin HEAD:"$BRANCH" || echo "⚠️ push ناموفق"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}