name: Windows Cloudflare Tunnel API Server

on:
  workflow_dispatch:
    inputs:
      session_minutes:
        description: 'مدت زمان اجرای سرور (دقیقه)'
        required: true
        default: '60'

jobs:
  run-api-server:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install g4f fastapi uvicorn pydantic

      - name: Create api_server.py
        shell: pwsh
        run: |
          $content = @'
          import os
          import json
          import time
          import secrets
          import warnings
          from typing import List, Optional, Dict, Any

          import g4f
          from fastapi import FastAPI, Depends, HTTPException, Header
          from pydantic import BaseModel, Field
          import uvicorn

          g4f.debug.logging = False
          warnings.filterwarnings("ignore", category=UserWarning)
          warnings.filterwarnings("ignore", category=RuntimeWarning)

          app = FastAPI(
              title="AI Chat API with Tool Calling",
              description="API for chat with AI using g4f and DeepInfra, with support for function calling.",
              version="1.0.0"
          )

          from fastapi.middleware.cors import CORSMiddleware
          app.add_middleware(
              CORSMiddleware,
              allow_origins=["*"],
              allow_credentials=True,
              allow_methods=["*"],
              allow_headers=["*"],
          )

          MODEL_NAME = "zai-org/GLM-5.2"
          PROVIDER = g4f.Provider.DeepInfra

          API_KEY = os.getenv("RDP_PASSWORD")
          if not API_KEY:
              raise RuntimeError(
                  "Environment variable RDP_PASSWORD is not set. "
                  "Please set it before running the server."
              )

          def verify_api_key(api_key: str) -> bool:
              return secrets.compare_digest(api_key, API_KEY)

          class Message(BaseModel):
              role: str
              content: Optional[str] = None
              tool_calls: Optional[List[Dict[str, Any]]] = None
              tool_call_id: Optional[str] = None

          class ToolFunction(BaseModel):
              name: str
              description: str
              parameters: Dict[str, Any]

          class Tool(BaseModel):
              type: str = "function"
              function: ToolFunction

          class ChatCompletionRequest(BaseModel):
              messages: List[Message]
              tools: Optional[List[Tool]] = None
              temperature: Optional[float] = None
              max_tokens: Optional[int] = None
              top_p: Optional[float] = None

          class ChatCompletionResponse(BaseModel):
              id: str
              object: str
              created: int
              model: str
              choices: List[Dict[str, Any]]
              usage: Optional[Dict[str, int]] = None

          async def get_api_key(x_api_key: str = Header(..., alias="X-API-Key")):
              if not verify_api_key(x_api_key):
                  raise HTTPException(status_code=401, detail="Invalid API key")
              return x_api_key

          def convert_g4f_response(g4f_response, model_name: str) -> Dict[str, Any]:
              message = g4f_response.choices[0].message
              content = getattr(message, 'content', None)
              tool_calls_raw = getattr(message, 'tool_calls', None)

              tool_calls = None
              if tool_calls_raw:
                  tool_calls = []
                  for tc in tool_calls_raw:
                      tool_calls.append({
                          "id": tc.id,
                          "type": "function",
                          "function": {
                              "name": tc.function.name,
                              "arguments": tc.function.arguments
                          }
                      })

              finish_reason = "tool_calls" if tool_calls else "stop"

              return {
                  "id": getattr(g4f_response, 'id', f"chatcmpl-{int(time.time())}"),
                  "object": "chat.completion",
                  "created": int(time.time()),
                  "model": model_name,
                  "choices": [
                      {
                          "index": 0,
                          "message": {
                              "role": "assistant",
                              "content": content,
                              "tool_calls": tool_calls
                          },
                          "finish_reason": finish_reason
                      }
                  ],
                  "usage": getattr(g4f_response, 'usage', None)
              }

          @app.post("/v1/chat/completions", response_model=ChatCompletionResponse)
          async def chat_completions(
              request: ChatCompletionRequest,
              api_key: str = Depends(get_api_key)
          ):
              messages = []
              for msg in request.messages:
                  msg_dict = {"role": msg.role, "content": msg.content}
                  if msg.tool_calls is not None:
                      msg_dict["tool_calls"] = msg.tool_calls
                  if msg.tool_call_id is not None:
                      msg_dict["tool_call_id"] = msg.tool_call_id
                  messages.append(msg_dict)

              tools = None
              if request.tools:
                  tools = [tool.dict() for tool in request.tools]

              params = {
                  "model": MODEL_NAME,
                  "messages": messages,
                  "provider": PROVIDER,
                  "stream": False,
              }
              if tools:
                  params["tools"] = tools
                  params["tool_choice"] = "auto"
              if request.temperature is not None:
                  params["temperature"] = request.temperature
              if request.max_tokens is not None:
                  params["max_tokens"] = request.max_tokens
              if request.top_p is not None:
                  params["top_p"] = request.top_p

              try:
                  client = g4f.Client()
                  response = client.chat.completions.create(**params)
                  return convert_g4f_response(response, MODEL_NAME)
              except Exception as e:
                  print(f"Error during completion: {type(e).__name__}: {e}")
                  raise HTTPException(status_code=500, detail="Internal server error")

          @app.get("/health")
          async def health():
              return {"status": "ok"}

          @app.get("/api/status")
          async def api_status(api_key: str = Depends(get_api_key)):
              return {"status": "ok", "model": MODEL_NAME}

          @app.get("/v1/models")
          async def list_models(api_key: str = Depends(get_api_key)):
              return {
                  "object": "list",
                  "data": [
                      {
                          "id": MODEL_NAME,
                          "object": "model",
                          "created": int(time.time()),
                          "owned_by": "DeepInfra"
                      }
                  ]
              }

          if __name__ == "__main__":
              uvicorn.run(app, host="0.0.0.0", port=5000)
          '@
          Set-Content -Path api_server.py -Value $content -Encoding UTF8

      - name: Start API Server
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          # راه‌اندازی سرور به صورت پس‌زمینه
          Start-Process -NoNewWindow -FilePath "python" -ArgumentList "api_server.py" -WorkingDirectory $PWD -RedirectStandardOutput "api_server.log" -RedirectStandardError "api_server.err"
          Start-Sleep -Seconds 8
          Write-Host "سرور API روی پورت 5000 اجرا شد"
          Get-Content api_server.log -ErrorAction SilentlyContinue
          Get-Content api_server.err -ErrorAction SilentlyContinue

      - name: Start Cloudflare Tunnel
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile "cloudflared.exe"

          Write-Host "راه‌اندازی تونل Cloudflare..."
          Start-Process -NoNewWindow -FilePath "$PWD\cloudflared.exe" -ArgumentList "tunnel --url http://localhost:5000 --no-autoupdate" -RedirectStandardOutput "cloudflare.log" -RedirectStandardError "cloudflare.err"
          Start-Sleep -Seconds 5

          $timeout = 60
          $startTime = Get-Date
          $tunnelUrl = $null
          while ($true) {
              if (-not (Get-Process cloudflared -ErrorAction SilentlyContinue)) {
                  Write-Host "cloudflared متوقف شد"
                  Get-Content cloudflare.log -ErrorAction SilentlyContinue
                  Get-Content cloudflare.err -ErrorAction SilentlyContinue
                  exit 1
              }
              $match = Select-String -Path "cloudflare.log","cloudflare.err" -Pattern 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' | Select-Object -First 1
              if ($match) {
                  $tunnelUrl = $match.Matches[0].Value
                  Write-Host "تونل ساخته شد: $tunnelUrl"
                  break
              }
              if (((Get-Date) - $startTime).TotalSeconds -ge $timeout) {
                  Write-Host "تونل در زمان مقرر ساخته نشد"
                  Get-Content cloudflare.log -ErrorAction SilentlyContinue
                  Get-Content cloudflare.err -ErrorAction SilentlyContinue
                  exit 1
              }
              Start-Sleep -Seconds 2
          }
          Add-Content -Path $env:GITHUB_ENV -Value "TUNNEL_URL=$tunnelUrl"

      - name: Update README with initial link
        shell: pwsh
        run: |
          Set-Content -Path README.md -Value $env:TUNNEL_URL
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "🔗 لینک API [skip ci]" | Out-Null
          git pull --rebase origin main
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep session alive and guard tunnel
        shell: pwsh
        run: |
          $duration = ${{ github.event.inputs.session_minutes }}
          $endTime = (Get-Date).AddMinutes([double]$duration)
          $tunnelUrl = $env:TUNNEL_URL
          Write-Host "سرور تا $duration دقیقه فعال خواهد ماند"

          Start-Sleep -Seconds 10

          while ((Get-Date) -lt $endTime) {
              $remaining = $endTime - (Get-Date)
              Write-Host "[$(Get-Date -Format 'HH:mm:ss')] زمان باقی‌مانده: $([math]::Floor($remaining.TotalMinutes)) دقیقه"

              $httpCode = & curl.exe -s -o NUL -w "%{http_code}" --connect-timeout 5 "$tunnelUrl/api/status" 2>$null
              if ($httpCode -ne "200" -and $httpCode -ne "401") {
                  Write-Host "تونل پاسخ نمی‌دهد (کد $httpCode) - راه‌اندازی مجدد..."

                  Stop-Process -Name cloudflared -Force -ErrorAction SilentlyContinue
                  Start-Sleep -Seconds 2

                  Start-Process -NoNewWindow -FilePath "$PWD\cloudflared.exe" -ArgumentList "tunnel --url http://localhost:5000 --no-autoupdate" -RedirectStandardOutput "cloudflare.log" -RedirectStandardError "cloudflare.err"
                  Start-Sleep -Seconds 8

                  $match = Select-String -Path "cloudflare.log","cloudflare.err" -Pattern 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' | Select-Object -First 1
                  if ($match) {
                      $newUrl = $match.Matches[0].Value
                      Write-Host "آدرس جدید: $newUrl"
                      if ($newUrl -ne $tunnelUrl) {
                          $tunnelUrl = $newUrl
                          Set-Content -Path README.md -Value $tunnelUrl
                          git config user.name "github-actions[bot]"
                          git config user.email "github-actions[bot]@users.noreply.github.com"
                          git add README.md
                          git commit -m "🔄 به‌روزرسانی لینک تونل [skip ci]" | Out-Null
                          git pull --rebase origin main
                          git push
                      }
                  } else {
                      Write-Host "نتوانستیم آدرس جدید را از لاگ بخوانیم"
                  }
              } else {
                  # یک درخواست ساده برای فعال نگه‌داشتن تونل
                  & curl.exe -s -o NUL "$tunnelUrl/api/status" 2>$null
              }

              Start-Sleep -Seconds 30
          }
          Write-Host "زمان به پایان رسید."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit any changes
        if: always()
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --exit-code | Out-Null
          if ($LASTEXITCODE -ne 0) {
              git commit -m "ذخیره تغییرات [skip ci]" | Out-Null
              git pull --rebase origin main
              git push
          } else {
              Write-Host "بدون تغییر"
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}