name: Kali Linux RDP with bore (Show in Log)

on:
  workflow_dispatch:
    inputs:
      session_minutes:
        description: 'Duration in minutes'
        required: true
        default: '120'

jobs:
  kali-rdp-tunnel:
    runs-on: ubuntu-latest
    container:
      image: kalilinux/kali-rolling
      options: --user root
    timeout-minutes: 360

    steps:
      - name: Install prerequisites
        shell: bash
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            ca-certificates \
            curl \
            dbus \
            dbus-x11 \
            xfce4 \
            xrdp \
            xorg \
            x11-xserver-utils \
            sudo \
            net-tools \
            iputils-ping

          # راه‌اندازی dbus
          mkdir -p /run/dbus
          dbus-daemon --system --fork --nopidfile

      - name: Configure root password and RDP
        shell: bash
        run: |
          # تنظیم رمز عبور root از Secret
          echo "root:${{ secrets.RDP_PASSWORD }}" | chpasswd
          if [ $? -ne 0 ]; then
            echo "Failed to set root password"
            exit 1
          fi

          # فعال‌سازی ورود root در xrdp (اگر فایل sesman.ini موجود باشد)
          if [ -f /etc/xrdp/sesman.ini ]; then
            # اگر خط AllowRootLogin وجود دارد، تغییر بده، وگرنه اضافه کن
            if grep -q '^AllowRootLogin=' /etc/xrdp/sesman.ini; then
              sed -i 's/^AllowRootLogin=.*/AllowRootLogin=true/' /etc/xrdp/sesman.ini
            else
              # اضافه کردن زیر [Security] یا در انتهای فایل
              echo "AllowRootLogin=true" >> /etc/xrdp/sesman.ini
            fi
          else
            # اگر فایل وجود نداشت، یک فایل ساده بسازیم
            cat > /etc/xrdp/sesman.ini <<'EOF'
[Globals]
ListenAddress=127.0.0.1
ListenPort=3350
EnableUserWindowManager=1
UserWindowManager=startwm.sh
MaxSessions=10

[Security]
AllowRootLogin=true
MaxLoginRetry=4
TerminalServerUsers=tsusers
TerminalServerAdmins=tsadmins
EOF
          fi

          # تنظیم Xfce به عنوان محیط پیش‌فرض
          echo "xfce4-session" > /root/.xsession
          chown root:root /root/.xsession

          # تنظیم startwm.sh برای اجرای Xfce
          sed -i 's/^test -x \/etc\/X11\/Xsession && exec \/etc\/X11\/Xsession/#&/' /etc/xrdp/startwm.sh
          echo 'startxfce4' >> /etc/xrdp/startwm.sh

          # راه‌اندازی xrdp
          /etc/init.d/xrdp start
          # تلاش برای sesman (در صورت وجود)
          if [ -f /etc/init.d/xrdp-sesman ]; then
            /etc/init.d/xrdp-sesman start
          else
            service xrdp-sesman start || true
          fi

          # بررسی پورت
          netstat -tulpn | grep 3389 || true

      - name: Download bore binary
        shell: bash
        run: |
          BORE_VERSION="v0.6.0"
          BORE_URL="https://github.com/ekzhang/bore/releases/download/${BORE_VERSION}/bore-${BORE_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "Downloading bore from: $BORE_URL"
          curl -L --fail -o bore.tar.gz "$BORE_URL"
          tar -xzf bore.tar.gz
          chmod +x bore
          ./bore --version

      - name: Create bore runner script
        shell: bash
        run: |
          cat > bore_runner.sh <<'EOF'
          #!/bin/bash
          OUT_LOG="bore_out.log"
          ERR_LOG="bore_err.log"
          TUNNEL_HOST="bore.pub"

          start_bore() {
            ./bore local 3389 --to bore.pub > "$OUT_LOG" 2> "$ERR_LOG" &
            BORE_PID=$!
            sleep 8

            PORT=$(grep -oP 'listening at [\w\.]+:(\d+)' "$OUT_LOG" | grep -oP '\d+$')
            if [ -n "$PORT" ]; then
              echo "host=$TUNNEL_HOST" > connection.txt
              echo "port=$PORT" >> connection.txt
              echo "Tunnel established on port $PORT"
              return 0
            else
              echo "ERROR: Could not start bore."
              return 1
            fi
          }

          # Keep-alive probe
          (
            while true; do
              (echo > /dev/tcp/127.0.0.1/3389) >/dev/null 2>&1
              sleep 30
            done
          ) &

          start_bore || exit 1

          while true; do
            sleep 30
            if ! pgrep -x "bore" > /dev/null; then
              echo "Bore stopped. Restarting..."
              start_bore
            fi
          done
          EOF

          chmod +x bore_runner.sh
          echo "bore_runner.sh created."

      - name: Start bore tunnel (detached)
        shell: bash
        run: |
          nohup ./bore_runner.sh > bore_runner.log 2>&1 &
          echo "Bore runner started in background."

          echo "Waiting for tunnel to be ready..."
          for i in {1..30}; do
            [ -f connection.txt ] && break
            sleep 1
          done
          if [ -f connection.txt ]; then
            echo "Tunnel is ready."
            cat connection.txt
          else
            echo "WARNING: Tunnel may not have started. Check bore_out.log and bore_err.log"
          fi

      - name: Display connection info
        shell: bash
        run: |
          source connection.txt
          echo ""
          echo "======================================================"
          echo "  KALI LINUX RDP READY"
          echo "======================================================"
          echo "  Host: $host"
          echo "  Port: $port"
          echo "  Username: root"
          echo "  Password: (your secret)"
          echo "======================================================"
          echo ""
          echo "In Microsoft Remote Desktop on Android:"
          echo "  PC Name: $host:$port"
          echo "  User Name: root"
          echo ""

      - name: Keep session alive
        shell: bash
        run: |
          DURATION=${{ github.event.inputs.session_minutes }}
          END_TIME=$(date -u -d "+${DURATION} minutes" +%s)

          echo "Session will stay active for ${DURATION} minutes."
          while [ $(date -u +%s) -lt $END_TIME ]; do
            REMAINING=$(( END_TIME - $(date -u +%s) ))
            echo "Remaining $((REMAINING/3600))h:$((REMAINING%3600/60))m:$((REMAINING%60))s | $(date -u '+%H:%M:%S')"
            sleep 60
          done
          echo "Time is up."
