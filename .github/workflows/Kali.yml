name: Kali Linux RDP with bore (Show in Log)

on:
  workflow_dispatch:
    inputs:
      session_minutes:
        description: 'Duration in minutes'
        required: true
        default: '120'

jobs:
  kali-rdp-tunnel:
    runs-on: ubuntu-latest
    container:
      image: kalilinux/kali-rolling
      options: --user root
    timeout-minutes: 360

    steps:
      - name: Install prerequisites
        shell: bash
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y ca-certificates curl dbus dbus-x11 xfce4 xrdp xorg x11-xserver-utils sudo net-tools iputils-ping
          mkdir -p /run/dbus
          dbus-daemon --system --fork --nopidfile

      - name: Configure root password and RDP
        shell: bash
        run: |
          echo "root:${{ secrets.RDP_PASSWORD }}" | chpasswd
          groupadd -f tsusers
          groupadd -f tsadmins
          usermod -aG tsusers,tsadmins root
          
          SESMAN_INI="/etc/xrdp/sesman.ini"
          if [ ! -f "$SESMAN_INI" ]; then
            printf "[Globals]\nListenAddress=127.0.0.1\nListenPort=3350\nEnableUserWindowManager=1\nUserWindowManager=startwm.sh\nMaxSessions=10\n\n[Security]\nAllowRootLogin=true\nMaxLoginRetry=4\nTerminalServerUsers=\nTerminalServerAdmins=\n" > "$SESMAN_INI"
          else
            grep -q '^AllowRootLogin=' "$SESMAN_INI" && sed -i 's/^AllowRootLogin=.*/AllowRootLogin=true/' "$SESMAN_INI" || echo "AllowRootLogin=true" >> "$SESMAN_INI"
            grep -q '^TerminalServerUsers=' "$SESMAN_INI" && sed -i 's/^TerminalServerUsers=.*/TerminalServerUsers=/' "$SESMAN_INI" || echo "TerminalServerUsers=" >> "$SESMAN_INI"
            grep -q '^TerminalServerAdmins=' "$SESMAN_INI" && sed -i 's/^TerminalServerAdmins=.*/TerminalServerAdmins=/' "$SESMAN_INI" || echo "TerminalServerAdmins=" >> "$SESMAN_INI"
          fi
          
          echo "xfce4-session" > /root/.xsession
          chown root:root /root/.xsession
          
          sed -i 's/^test -x \/etc\/X11\/Xsession && exec \/etc\/X11\/Xsession/#&/' /etc/xrdp/startwm.sh
          echo 'startxfce4' >> /etc/xrdp/startwm.sh
          
          pkill -f xrdp-sesman || true
          pkill -f xrdp || true
          sleep 2
          
          /etc/init.d/xrdp start
          service xrdp-sesman start || true
          
          sleep 2
          netstat -tulpn | grep 3389 || true
          echo "Root user info:"
          id root
          grep "^root:" /etc/passwd
          HASH=$(grep "^root:" /etc/shadow | cut -d: -f2)
          echo "Root password hash starts with: ${HASH:0:10}..."

      - name: Download bore binary
        shell: bash
        run: |
          BORE_VERSION="v0.6.0"
          BORE_URL="https://github.com/ekzhang/bore/releases/download/${BORE_VERSION}/bore-${BORE_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "Downloading bore from: $BORE_URL"
          curl -L --fail -o bore.tar.gz "$BORE_URL"
          tar -xzf bore.tar.gz
          chmod +x bore
          ./bore --version

      - name: Create bore runner script
        shell: bash
        run: |
          printf '#!/bin/bash\nOUT_LOG="bore_out.log"\nERR_LOG="bore_err.log"\nTUNNEL_HOST="bore.pub"\n\nstart_bore() {\n  ./bore local 3389 --to bore.pub > "$OUT_LOG" 2> "$ERR_LOG" &\n  BORE_PID=$!\n  sleep 8\n  PORT=$(grep -oP "listening at [\\w\\.]+:(\\d+)" "$OUT_LOG" | grep -oP "\\d+$")\n  if [ -n "$PORT" ]; then\n    echo "host=$TUNNEL_HOST" > connection.txt\n    echo "port=$PORT" >> connection.txt\n    echo "Tunnel established on port $PORT"\n    return 0\n  else\n    echo "ERROR: Could not start bore."\n    return 1\n  fi\n}\n\n(\n  while true; do\n    (echo > /dev/tcp/127.0.0.1/3389) >/dev/null 2>&1\n    sleep 30\n  done\n) &\n\nstart_bore || exit 1\n\nwhile true; do\n  sleep 30\n  if ! pgrep -x "bore" > /dev/null; then\n    echo "Bore stopped. Restarting..."\n    start_bore\n  fi\ndone\n' > bore_runner.sh
          chmod +x bore_runner.sh
          echo "bore_runner.sh created."

      - name: Start bore tunnel (detached)
        shell: bash
        run: |
          nohup ./bore_runner.sh > bore_runner.log 2>&1 &
          echo "Bore runner started in background."
          echo "Waiting for tunnel to be ready..."
          for i in {1..30}; do
            [ -f connection.txt ] && break
            sleep 1
          done
          if [ -f connection.txt ]; then
            echo "Tunnel is ready."
            cat connection.txt
          else
            echo "WARNING: Tunnel may not have started."
          fi

      - name: Display connection info
        shell: bash
        run: |
          source connection.txt
          echo ""
          echo "======================================================"
          echo "  KALI LINUX RDP READY"
          echo "======================================================"
          echo "  Host: $host"
          echo "  Port: $port"
          echo "  Username: root"
          echo "  Password: (your secret)"
          echo "======================================================"
          echo ""
          echo "In Microsoft Remote Desktop on Android:"
          echo "  PC Name: $host:$port"
          echo "  User Name: root"
          echo ""

      - name: Keep session alive
        shell: bash
        run: |
          DURATION=${{ github.event.inputs.session_minutes }}
          END_TIME=$(date -u -d "+${DURATION} minutes" +%s)
          echo "Session will stay active for ${DURATION} minutes."
          while [ $(date -u +%s) -lt $END_TIME ]; do
            REMAINING=$(( END_TIME - $(date -u +%s) ))
            echo "Remaining $((REMAINING/3600))h:$((REMAINING%3600/60))m:$((REMAINING%60))s | $(date -u '+%H:%M:%S')"
            sleep 60
          done
          echo "Time is up."