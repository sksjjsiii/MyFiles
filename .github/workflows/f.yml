name: Make All Repositories Private (Delete Forks)

on:
  workflow_dispatch:  # اجرای دستی

jobs:
  process-repositories:
    runs-on: ubuntu-latest
    
    steps:
      - name: Process repositories (delete forks, make private others)
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          USERNAME: "RaptorKingdom"
        run: |
          echo "Fetching list of all repositories (including forks)..."
          
          PAGE=1
          while true; do
            # دریافت نام و وضعیت فورک برای هر مخزن
            REPO_INFO=$(curl -s -H "Authorization: token $PAT_TOKEN" \
              "https://api.github.com/user/repos?per_page=100&page=$PAGE&type=all" | \
              jq -r '.[] | "\(.name) \(.fork)"')
            
            if [ -z "$REPO_INFO" ]; then
              break
            fi
            
            # پردازش هر خط: نام مخزن و وضعیت فورک
            echo "$REPO_INFO" | while read -r repo is_fork; do
              if [ "$is_fork" = "true" ]; then
                echo "🔴 Repository '$repo' is a fork. Deleting..."
                
                DELETE_RESPONSE=$(curl -s -X DELETE \
                  -H "Authorization: token $PAT_TOKEN" \
                  -H "Accept: application/vnd.github.v3+json" \
                  "https://api.github.com/repos/$USERNAME/$repo")
                
                # بررسی موفقیت حذف (پاسخ خالی معمولاً موفقیت است)
                if [ -z "$DELETE_RESPONSE" ]; then
                  echo "✅ Fork '$repo' deleted successfully"
                else
                  echo "❌ Failed to delete fork '$repo'"
                  echo "Response: $DELETE_RESPONSE"
                fi
              else
                echo "Making repository '$repo' private..."
                
                PATCH_RESPONSE=$(curl -s -X PATCH \
                  -H "Authorization: token $PAT_TOKEN" \
                  -H "Accept: application/vnd.github.v3+json" \
                  -d '{"private": true}' \
                  "https://api.github.com/repos/$USERNAME/$repo")
                
                if echo "$PATCH_RESPONSE" | grep -q '"private": true'; then
                  echo "✅ Repository '$repo' is now private"
                else
                  echo "❌ Failed to make '$repo' private"
                  echo "Response: $PATCH_RESPONSE"
                fi
              fi
            done
            
            PAGE=$((PAGE + 1))
          done
          
          echo "All repositories processed!"