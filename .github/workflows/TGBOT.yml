          @app.post("/api/dm/conversations")
          def create_conversation(payload: ConversationCreate, user=Depends(require_user)):
              ids = set(payload.user_ids or []); ids.add(user["id"])
              if len(ids) < 2: raise HTTPException(400, "At least two users required")
              for uid in ids:
                  if not query_one("SELECT id FROM users WHERE id=?", (uid,)): raise HTTPException(404, f"User {uid} not found")
              is_group = payload.is_group or len(ids) > 2
              if not is_group and len(ids) == 2:
                  uid1, uid2 = list(ids)
                  existing = find_direct_conversation(uid1, uid2)
                  if existing: return conversation_dict(existing["id"], user)
              conv_id = execute("INSERT INTO conversations(is_group, name, created_by, created_at) VALUES(?,?,?,?)", (1 if is_group else 0, payload.name, user["id"], now_iso()))
              for uid in ids: execute("INSERT OR IGNORE INTO conversation_members(conversation_id, user_id, role, joined_at, last_read_message_id) VALUES(?,?,?,?,0)", (conv_id, uid, "owner" if uid == user["id"] else "member", now_iso()))
