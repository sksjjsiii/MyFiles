          def send_message(conversation_id: int, payload: MessageCreate, user=Depends(require_user)):
              ensure_member(conversation_id, user)
              message_id = execute("INSERT INTO messages(conversation_id, sender_id, text, created_at, reply_to_id) VALUES(?,?,?,?,?)", (conversation_id, user["id"], payload.text or "", now_iso(), payload.reply_to_id))
              if payload.media_ids:
                  for media_id in payload.media_ids: execute("INSERT OR IGNORE INTO message_media(message_id, media_id) VALUES(?,?)", (message_id, media_id))
              execute("INSERT OR IGNORE INTO message_reads(message_id, user_id, read_at) VALUES(?,?,?)", (message_id, user["id"], now_iso()))
              notify_mentions(payload.text, user["id"], None, message_id)
              members = query("SELECT user_id FROM conversation_members WHERE conversation_id=?", (conversation_id,))
              for member in members:
                  if member["user_id"] != user["id"]: notify(member["user_id"], user["id"], "direct", None, message_id, (payload.text or "New message")[:100])
              row = query_one("SELECT * FROM messages WHERE id=?", (message_id,))
              return message_dict(row, user)

