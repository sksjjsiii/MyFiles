          def delete_message(message_id: int, user=Depends(require_user)):
              row = query_one("SELECT * FROM messages WHERE id=?", (message_id,))
              if not row or row["deleted"]: raise HTTPException(404, "Message not found")
              if row["sender_id"] != user["id"] and not user["is_admin"]: raise HTTPException(403, "Forbidden")
              execute("UPDATE messages SET deleted=1, text='' WHERE id=?", (message_id,))
              return {"deleted": True}

          @app.post("/api/dm/conversations/{conversation_id}/members")
          def add_member(conversation_id: int, payload: AddMemberModel, user=Depends(require_user)):
              ensure_member(conversation_id, user)
              conv = query_one("SELECT * FROM conversations WHERE id=?", (conversation_id,))
              if not conv or not conv["is_group"]: raise HTTPException(400, "Only groups can add members")
              target = query_one("SELECT * FROM users WHERE id=?", (payload.user_id,))
              if not target: raise HTTPException(404, "User not found")
              execute("INSERT OR IGNORE INTO conversation_members(conversation_id, user_id, role, joined_at, last_read_message_id) VALUES(?,?,?,?,0)", (conversation_id, target["id"], "member", now_iso()))
              notify(target["id"], user["id"], "group_add", None, None, "You were added to a group")
              return conversation_dict(conversation_id, user)

          @app.post("/api/admin/users/{username}/verify")
          def admin_verify_user(username: str, payload: AdminVerifyModel, admin=Depends(require_admin)):
              row = query_one("SELECT * FROM users WHERE username=?", (username,))
              if not row: raise HTTPException(404, "User not found")
              execute("UPDATE users SET is_verified=? WHERE id=?", (1 if payload.verified else 0, row["id"]))
              return user_dict(query_one("SELECT * FROM users WHERE id=?", (row["id"],)), admin, include_email=True)

          @app.get("/api/search")
          def search(q: str = "", media_type: Optional[str] = None, user=Depends(optional_user)):
              if not q and not media_type: return {"users": [], "posts": []}
              like = f"%{q}%" if q else "%"
              users = query("SELECT * FROM users WHERE username LIKE ? OR name LIKE ? OR bio LIKE ? LIMIT 20", (like, like, like))
              if media_type:
                  posts = query("SELECT DISTINCT p.* FROM posts p JOIN post_media pm ON pm.post_id = p.id JOIN media m ON m.id = pm.media_id WHERE (p.text LIKE ? OR m.title LIKE ? OR m.artist LIKE ? OR m.original_name LIKE ?) AND m.media_type = ? ORDER BY p.created_at DESC LIMIT 20", (like, like, like, like, media_type))
              else:
                  posts = query("SELECT * FROM posts WHERE text LIKE ? ORDER BY created_at DESC LIMIT 20", (like,))
              return {"users": [user_dict(r, user) for r in users], "posts": [post_dict(r, user) for r in posts]}
          ''').strip() + '\n'
          with open("app.py", "w") as f:
              f.write(content)
          WRITER

      - name: Write backup script
        run: |
          python3 << 'WRITER2'
          import textwrap
          content = textwrap.dedent('''
          import os, base64, requests, tarfile, pathlib, subprocess, sqlite3, shutil, sys
          TOKEN = os.environ.get("PAT_TOKEN", "")
          REPO = os.environ.get("STORAGE_REPO", "")
          DATA_DIR = "data"
          if not TOKEN or not REPO or not os.path.isdir(DATA_DIR): sys.exit(0)
          try:
              db_path = os.path.join(DATA_DIR, "app.db")
              if os.path.exists(db_path):
                  src = sqlite3.connect(f"file:{db_path}?mode=ro", uri=True, timeout=60)
                  dst = sqlite3.connect(os.path.join(DATA_DIR, "app.db.backup"), timeout=60)
                  with dst: src.backup(dst)
                  src.close(); dst.close()
          except Exception as e: print("SQLite backup failed:", e)
          if os.path.exists("data.tar.gz"): os.remove("data.tar.gz")
          with tarfile.open("data.tar.gz", "w:gz") as tar: tar.add(DATA_DIR)
          headers = {"Authorization": f"Bearer {TOKEN}", "Accept": "application/vnd.github+json"}
          def upload_contents(local_path, remote_path, message):
              size = os.path.getsize(local_path)
              if size > 95_000_000: raise Exception("Too large")
              url = f"https://api.github.com/repos/{REPO}/contents/{remote_path}"
              r = requests.get(url, headers=headers)
              sha = r.json().get("sha") if r.status_code == 200 else None
              with open(local_path, "rb") as f: content = base64.b64encode(f.read()).decode()
              payload = {"message": message, "content": content}
              if sha: payload["sha"] = sha
              resp = requests.put(url, headers=headers, json=payload)
              if resp.status_code not in (200, 201): raise Exception(resp.text[:1000])
          def git_fallback():
              if os.path.exists(".storage_repo"): shutil.rmtree(".storage_repo")
              subprocess.run(["git", "clone", f"https://x-access-token:{TOKEN}@github.com/{REPO}.git", ".storage_repo"], check=True, capture_output=True)
              shutil.copy("data.tar.gz", ".storage_repo/data.tar.gz")
              backup_dir = os.path.join(".storage_repo", "backup")
              os.makedirs(backup_dir, exist_ok=True)
              for p in pathlib.Path(DATA_DIR).rglob("*"):
                  if p.is_file() and p.suffix.lower() in [".db", ".sqlite", ".sqlite3"]:
                      shutil.copy(str(p), os.path.join(backup_dir, str(p).replace(os.sep, "_")))
              subprocess.run(["git", "config", "user.name", "github-actions[bot]"], cwd=".storage_repo", capture_output=True)
              subprocess.run(["git", "config", "user.email", "github-actions[bot]@users.noreply.github.com"], cwd=".storage_repo", capture_output=True)
              subprocess.run(["git", "add", "-A"], cwd=".storage_repo", capture_output=True)
              commit = subprocess.run(["git", "commit", "-m", "Backup data [skip ci]"], cwd=".storage_repo", capture_output=True)
              if commit.returncode == 0: subprocess.run(["git", "push"], cwd=".storage_repo", capture_output=True)
          try:
              upload_contents("data.tar.gz", "data.tar.gz", "Backup data [skip ci]")
              for p in pathlib.Path(DATA_DIR).rglob("*"):
                  if p.is_file() and p.suffix.lower() in [".db", ".sqlite", ".sqlite3"]:
                      try: upload_contents(str(p), "backup/" + str(p).replace(os.sep, "_"), f"Backup {p} [skip ci]")
                      except: pass
          except Exception as e:
              print("API backup failed:", e)
              try: git_fallback()
              except: pass
          ''').strip() + '\n'
          with open("backup.py", "w") as f:
              f.write(content)
          WRITER2

      - name: Start FastAPI server
        env:
          OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
          SESSION_MINUTES: ${{ env.SESSION_MINUTES }}
          DATA_DIR: ${{ env.DATA_DIR }}
        run: |
          nohup python -m uvicorn app:app --host 0.0.0.0 --port 5000 > api.log 2>&1 &
          sleep 6
          curl -s http://localhost:5000/api/status || (echo "API failed"; cat api.log; exit 1)

      - name: Install and start Cloudflare tunnel
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          ./cloudflared tunnel --url http://localhost:5000 --no-autoupdate > cloudflare.log 2>&1 &
          sleep 8
          for i in $(seq 1 30); do
            TUNNEL_URL=$(grep -oP 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' cloudflare.log | head -n1 || true)
            if [ -n "$TUNNEL_URL" ]; then break; fi
            sleep 2
          done
          if [ -z "$TUNNEL_URL" ]; then cat cloudflare.log; exit 1; fi
          echo "TUNNEL_URL=$TUNNEL_URL" >> $GITHUB_ENV
          echo "$TUNNEL_URL" > link.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add link.txt
          git commit -m "🔗 API link [skip ci]" || true
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin HEAD:"${GITHUB_REF_NAME}" || true

      - name: Watchdog, periodic backup and keep session alive
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          TUNNEL_URL: ${{ env.TUNNEL_URL }}
        run: |
          set +e
          DURATION="${SESSION_MINUTES}"
          END_TIME=$(date -d "$DURATION minutes" +%s)
          LAST_BACKUP=$(date +%s)
          BACKUP_INTERVAL=1800
          sleep 10
          while [ "$(date +%s)" -lt "$END_TIME" ]; do
            REMAINING=$((END_TIME - $(date +%s)))
            echo "[$(date +%H:%M:%S)] Remaining: $((REMAINING / 60)) minutes"
            curl -s -o /dev/null http://localhost:5000/api/status
            if [ $? -ne 0 ]; then
              pkill -f uvicorn || true; sleep 2
              nohup python -m uvicorn app:app --host 0.0.0.0 --port 5000 > api.log 2>&1 &
              sleep 5
            fi
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 5 "$TUNNEL_URL/api/status" || echo "000")
            if [ "$HTTP_CODE" != "200" ]; then
              pkill cloudflared || true; sleep 2
              ./cloudflared tunnel --url http://localhost:5000 --no-autoupdate > cloudflare.log 2>&1 &
              sleep 10
              NEW_URL=$(grep -oP 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' cloudflare.log | head -n1 || true)
              if [ -n "$NEW_URL" ]; then
                TUNNEL_URL="$NEW_URL"; echo "$NEW_URL" > link.txt
                git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
                git add link.txt; git commit -m "🔄 Update tunnel link [skip ci]" || true
                git pull --rebase origin "${GITHUB_REF_NAME}" || true; git push origin HEAD:"${GITHUB_REF_NAME}" || true
              fi
            else
              curl -s -o /dev/null "$TUNNEL_URL/api/status" || true
            fi
            NOW=$(date +%s)
            if [ $((NOW - LAST_BACKUP)) -ge "$BACKUP_INTERVAL" ]; then
              python backup.py || true; LAST_BACKUP=$NOW
            fi
            sleep 30
          done

      - name: Final backup and upload to storage repository
        if: always()
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          python backup.py || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            api.log
            cloudflare.log
          if-no-files-found: ignore