          @app.get("/api/dm/conversations/{conversation_id}/messages")
          def get_messages(conversation_id: int, limit: int = Query(50, le=200), before_id: Optional[int] = None, user=Depends(require_user)):
              ensure_member(conversation_id, user)
              sql = "SELECT * FROM messages WHERE conversation_id=?"; params = [conversation_id]
              if before_id: sql += " AND id < ?"; params.append(before_id)
              sql += " ORDER BY id DESC LIMIT ?"; params.append(limit)
              rows = query(sql, tuple(params))
              rows = list(reversed(rows))
              if rows:
                  max_id = rows[-1]["id"]
                  execute("UPDATE conversation_members SET last_read_message_id=? WHERE conversation_id=? AND user_id=?", (max_id, conversation_id, user["id"]))
                  for m in rows: execute("INSERT OR IGNORE INTO message_reads(message_id, user_id, read_at) VALUES(?,?,?)", (m["id"], user["id"], now_iso()))
              return [message_dict(m, user) for m in rows]

