          @app.post("/api/media/upload")
          def upload_media(file: UploadFile = File(...), user=Depends(require_user)):
              media_id = uuid.uuid4().hex
              ext = Path(file.filename or "file").suffix.lower()
              safe_ext = ext if len(ext) <= 10 else ""
              filename = f"{media_id}{safe_ext}"
              path = MEDIA_DIR / filename
              content_type = file.content_type
              with open(path, "wb") as f: shutil.copyfileobj(file.file, f)
              media_type = classify_media(content_type, file.filename)
              thumbnail = make_thumbnail(media_id, path, media_type)
              title, artist, duration = None, None, None
              if media_type == "audio": title, artist, duration = extract_audio_metadata(path)
              execute("INSERT INTO media(id, owner_id, original_name, filename, path, mime_type, media_type, thumbnail, title, artist, duration, created_at) VALUES(?,?,?,?,?,?,?,?,?,?,?,?)", (media_id, user["id"], file.filename, filename, str(path), content_type, media_type, thumbnail, title, artist, duration, now_iso()))
              row = query_one("SELECT * FROM media WHERE id=?", (media_id,))
              return media_row_to_dict(row)

