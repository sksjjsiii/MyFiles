          @app.get("/api/explore")
          def explore(user=Depends(optional_user)):
              post_rows = query("SELECT * FROM posts WHERE parent_id IS NULL AND repost_of_id IS NULL ORDER BY created_at DESC LIMIT 100")
              scored = []
              for r in post_rows:
                  d = post_dict(r, user)
                  score = d["likes_count"]*3 + d["replies_count"]*2 + d["retweets_count"]*3 + d["shares_count"]*2 + d["bookmarks_count"]
                  scored.append((score, d))
              scored.sort(key=lambda x: x[0], reverse=True)
              users = query("SELECT u.*, (SELECT COUNT(*) FROM follows f WHERE f.followee_id=u.id) AS followers FROM users u ORDER BY followers DESC LIMIT 20")
              tags = {}
              recent = query("SELECT text FROM posts WHERE created_at >= ? LIMIT 300", ((datetime.utcnow() - timedelta(days=7)).isoformat(),))
              for row in recent:
                  for tag in re.findall(r"#(\\w+)", row["text"] or ""): tags[tag] = tags.get(tag, 0) + 1
              return {"posts": [x[1] for x in scored[:20]], "users": [user_dict(r, user) for r in users], "tags": [{"tag": k, "count": v} for k, v in sorted(tags.items(), key=lambda x: x[1], reverse=True)[:20]]}

