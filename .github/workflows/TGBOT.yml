name: Forever Bot

on:
  workflow_dispatch:
    inputs:
      session_minutes:
        description: "مدت زمان اجرا (دقیقه) - پیش‌فرض ۳۵۰ دقیقه"
        required: true
        default: "350"
      storage_repo:
        description: "مخزن ذخیره‌سازی فایل‌ها و دیتابیس"
        required: true
        default: "sksjjsiii/Files"

concurrency:
  group: forever-bot
  cancel-in-progress: false

permissions: write-all

jobs:
  forever-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      SESSION_MINUTES: ${{ github.event.inputs.session_minutes || '350' }}
      STORAGE_REPO: ${{ github.event.inputs.storage_repo || 'sksjjsiii/Files' }}
      DATA_DIR: ${{ github.workspace }}/data
      PORT: 5000
      OWNER_EMAIL: amir@example.com

    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl jq zip git
          python -m pip install --upgrade pip
          pip install fastapi "uvicorn[standard]" python-multipart PyJWT pillow requests mutagen

      - name: Create data folders
        run: |
          mkdir -p data/media data/thumbs

      - name: Restore data from storage repository
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          set +e
          echo "Downloading backup from $STORAGE_REPO..."
          HTTP_CODE=$(curl -s -o data.tar.gz -w "%{http_code}" \
            -H "Authorization: Bearer $PAT_TOKEN" \
            -H "Accept: application/vnd.github.raw+json" \
            "https://api.github.com/repos/$STORAGE_REPO/contents/data.tar.gz")
          if [ "$HTTP_CODE" = "200" ] && [ -s data.tar.gz ]; then
            tar -xzf data.tar.gz -C . || true
            rm -f data.tar.gz
          fi
          if [ -f data/app.db.backup ]; then
            cp -f data/app.db.backup data/app.db || true
          fi
          mkdir -p data/media data/thumbs

      - name: Write FastAPI application
        run: |
          python3 << 'WRITER'
          import textwrap
          content = textwrap.dedent('''
          import os, re, sqlite3, secrets, hashlib, time, uuid, shutil, subprocess
          from datetime import datetime, timedelta
          from pathlib import Path
          from typing import Optional, List
          from fastapi import FastAPI, Depends, HTTPException, UploadFile, File, Query
          from fastapi.middleware.cors import CORSMiddleware
          from fastapi.staticfiles import StaticFiles
          from fastapi.security import HTTPBearer, HTTPAuthorizationCredentials
          from pydantic import BaseModel
          import jwt

          DATA_DIR = Path(os.environ.get("DATA_DIR", "data")).resolve()
          MEDIA_DIR = DATA_DIR / "media"
          THUMB_DIR = DATA_DIR / "thumbs"
          DB_PATH = DATA_DIR / "app.db"
          for d in (DATA_DIR, MEDIA_DIR, THUMB_DIR): d.mkdir(parents=True, exist_ok=True)

          SECRET_FILE = DATA_DIR / "secret_key.txt"
          SECRET = SECRET_FILE.read_text().strip() if SECRET_FILE.exists() else secrets.token_urlsafe(64)
          if not SECRET_FILE.exists(): SECRET_FILE.write_text(SECRET)

          START_TIME = time.time()
          SESSION_MINUTES = int(os.environ.get("SESSION_MINUTES", "350"))
          ALGORITHM = "HS256"
          app = FastAPI(title="Twitter-like API")
          app.add_middleware(CORSMiddleware, allow_origins=["*"], allow_credentials=True, allow_methods=["*"], allow_headers=["*"])
          app.mount("/media", StaticFiles(directory=MEDIA_DIR), name="media")
          app.mount("/thumbs", StaticFiles(directory=THUMB_DIR), name="thumbs")
          bearer = HTTPBearer(auto_error=False)

          def get_conn():
              conn = sqlite3.connect(DB_PATH, timeout=60)
              conn.row_factory = sqlite3.Row
              conn.execute("PRAGMA foreign_keys=ON")
              return conn

          def execute(sql, params=()):
              conn = get_conn()
              try:
                  cur = conn.execute(sql, params)
                  conn.commit()
                  return cur.lastrowid
              finally: conn.close()

          def query(sql, params=()):
              conn = get_conn()
              try: return conn.execute(sql, params).fetchall()
              finally: conn.close()

          def query_one(sql, params=()):
              rows = query(sql, params)
              return rows[0] if rows else None

          def now_iso(): return datetime.utcnow().isoformat()

          def parse_dt(value):
              if not value: return None
              try: return datetime.fromisoformat(value)
              except: return None

          def is_online(last_seen):
              dt = parse_dt(last_seen)
              return dt and (datetime.utcnow() - dt < timedelta(minutes=2))

          def hash_password(password: str) -> str:
              salt = secrets.token_hex(16)
              dk = hashlib.pbkdf2_hmac("sha256", password.encode(), bytes.fromhex(salt), 200000)
              return f"pbkdf2$200000${salt}${dk.hex()}"

          def verify_password(password: str, stored: str) -> bool:
              try:
                  _, iterations, salt, dk = stored.split("$")
                  calc = hashlib.pbkdf2_hmac("sha256", password.encode(), bytes.fromhex(salt), int(iterations))
                  return calc.hex() == dk
              except: return False

          def create_token(user_id: int) -> str:
              return jwt.encode({"sub": str(user_id), "exp": datetime.utcnow() + timedelta(days=30)}, SECRET, algorithm=ALGORITHM)

          def extract_audio_metadata(path):
              try:
                  from mutagen import File
                  audio = File(path)
                  if not audio: return None, None, None
                  duration = getattr(audio.info, 'length', None) if hasattr(audio, 'info') else getattr(audio, 'length', None)
                  title, artist = None, None
                  tags = getattr(audio, 'tags', None)
                  if tags:
                      if hasattr(tags, 'getall'):
                          t = tags.getall('TIT2')
                          if t: title = str(t[0])
                          a = tags.getall('TPE1')
                          if a: artist = str(a[0])
                      else:
                          if '\\xa9nam' in tags: title = str(tags['\\xa9nam'][0])
                          if '\\xa9ART' in tags: artist = str(tags['\\xa9ART'][0])
                          if 'title' in tags: 
                              val = tags['title']
                              title = val[0] if isinstance(val, list) else val
                          if 'artist' in tags: 
                              val = tags['artist']
                              artist = val[0] if isinstance(val, list) else val
                  return title, artist, duration
              except: return None, None, None

          def init_db():
              execute("PRAGMA journal_mode=WAL")
              execute("""CREATE TABLE IF NOT EXISTS users (id INTEGER PRIMARY KEY AUTOINCREMENT, email TEXT UNIQUE NOT NULL, username TEXT UNIQUE NOT NULL COLLATE NOCASE, password_hash TEXT NOT NULL, name TEXT DEFAULT '', bio TEXT DEFAULT '', is_verified INTEGER DEFAULT 0, is_admin INTEGER DEFAULT 0, created_at TEXT, last_seen TEXT)""")
              execute("""CREATE TABLE IF NOT EXISTS media (id TEXT PRIMARY KEY, owner_id INTEGER, original_name TEXT, filename TEXT, path TEXT, mime_type TEXT, media_type TEXT, thumbnail TEXT, title TEXT, artist TEXT, duration REAL, created_at TEXT, FOREIGN KEY(owner_id) REFERENCES users(id) ON DELETE SET NULL)""")
              execute("""CREATE TABLE IF NOT EXISTS user_media (id INTEGER PRIMARY KEY AUTOINCREMENT, user_id INTEGER NOT NULL, media_id TEXT NOT NULL, type TEXT NOT NULL, position INTEGER DEFAULT 0)""")
              execute("""CREATE TABLE IF NOT EXISTS posts (id INTEGER PRIMARY KEY AUTOINCREMENT, user_id INTEGER, text TEXT DEFAULT '', created_at TEXT, edited_at TEXT, parent_id INTEGER, quoted_post_id INTEGER, repost_of_id INTEGER)""")
              execute("""CREATE TABLE IF NOT EXISTS post_media (post_id INTEGER NOT NULL, media_id TEXT NOT NULL, position INTEGER DEFAULT 0, PRIMARY KEY(post_id, media_id))""")
              execute("""CREATE TABLE IF NOT EXISTS likes (user_id INTEGER NOT NULL, post_id INTEGER NOT NULL, created_at TEXT, PRIMARY KEY(user_id, post_id))""")
              execute("""CREATE TABLE IF NOT EXISTS retweets (user_id INTEGER NOT NULL, post_id INTEGER NOT NULL, created_at TEXT, PRIMARY KEY(user_id, post_id))""")
              execute("""CREATE TABLE IF NOT EXISTS bookmarks (user_id INTEGER NOT NULL, post_id INTEGER NOT NULL, created_at TEXT, PRIMARY KEY(user_id, post_id))""")
              execute("""CREATE TABLE IF NOT EXISTS shares (id INTEGER PRIMARY KEY AUTOINCREMENT, user_id INTEGER NOT NULL, post_id INTEGER NOT NULL, created_at TEXT)""")
              execute("""CREATE TABLE IF NOT EXISTS follows (follower_id INTEGER NOT NULL, followee_id INTEGER NOT NULL, created_at TEXT, PRIMARY KEY(follower_id, followee_id))""")
              execute("""CREATE TABLE IF NOT EXISTS notifications (id INTEGER PRIMARY KEY AUTOINCREMENT, user_id INTEGER NOT NULL, actor_id INTEGER, type TEXT NOT NULL, post_id INTEGER, message_id INTEGER, text TEXT, read INTEGER DEFAULT 0, created_at TEXT)""")
              execute("""CREATE TABLE IF NOT EXISTS conversations (id INTEGER PRIMARY KEY AUTOINCREMENT, is_group INTEGER DEFAULT 0, name TEXT, created_by INTEGER, created_at TEXT)""")
              execute("""CREATE TABLE IF NOT EXISTS conversation_members (conversation_id INTEGER NOT NULL, user_id INTEGER NOT NULL, role TEXT DEFAULT 'member', joined_at TEXT, last_read_message_id INTEGER DEFAULT 0, PRIMARY KEY(conversation_id, user_id))""")
              execute("""CREATE TABLE IF NOT EXISTS messages (id INTEGER PRIMARY KEY AUTOINCREMENT, conversation_id INTEGER NOT NULL, sender_id INTEGER, text TEXT DEFAULT '', created_at TEXT, edited_at TEXT, deleted INTEGER DEFAULT 0, reply_to_id INTEGER)""")
              execute("""CREATE TABLE IF NOT EXISTS message_media (message_id INTEGER NOT NULL, media_id TEXT NOT NULL, PRIMARY KEY(message_id, media_id))""")
              execute("""CREATE TABLE IF NOT EXISTS message_reads (message_id INTEGER NOT NULL, user_id INTEGER NOT NULL, read_at TEXT, PRIMARY KEY(message_id, user_id))""")
              execute("""CREATE TABLE IF NOT EXISTS stories (id INTEGER PRIMARY KEY AUTOINCREMENT, user_id INTEGER NOT NULL, media_id TEXT, text TEXT DEFAULT '', created_at TEXT, expires_at TEXT)""")
              execute("""CREATE TABLE IF NOT EXISTS story_views (story_id INTEGER NOT NULL, user_id INTEGER NOT NULL, viewed_at TEXT, PRIMARY KEY(story_id, user_id))""")
              migrate_db()

          def migrate_db():
              cols = [row[1] for row in query("PRAGMA table_info(media)")]
              if "title" not in cols: execute("ALTER TABLE media ADD COLUMN title TEXT")
              if "artist" not in cols: execute("ALTER TABLE media ADD COLUMN artist TEXT")
              if "duration" not in cols: execute("ALTER TABLE media ADD COLUMN duration REAL")

          def seed_owner():
              row = query_one("SELECT id FROM users WHERE username=?", ("Amir",))
              if row: return
              email = os.environ.get("OWNER_EMAIL", "amir@example.com")
              password = os.environ.get("OWNER_PASSWORD") or "Founder@123"
              try:
                  execute("INSERT INTO users(email, username, password_hash, name, bio, is_verified, is_admin, created_at, last_seen) VALUES(?,?,?,?,?,?,?,?,?)",
                          (email, "Amir", hash_password(password), "امیر", "Founder", 1, 1, now_iso(), now_iso()))
              except: pass

          def optional_user(credentials: HTTPAuthorizationCredentials = Depends(bearer)):
              if not credentials: return None
              try:
                  payload = jwt.decode(credentials.credentials, SECRET, algorithms=[ALGORITHM])
                  user_id = int(payload.get("sub", 0))
              except: return None
              user = query_one("SELECT * FROM users WHERE id=?", (user_id,))
              if not user: return None
              execute("UPDATE users SET last_seen=? WHERE id=?", (now_iso(), user["id"]))
              return query_one("SELECT * FROM users WHERE id=?", (user_id,))

          def require_user(user=Depends(optional_user)):
              if not user: raise HTTPException(status_code=401, detail="Unauthorized")
              return user

          def require_admin(user=Depends(require_user)):
              if not user["is_admin"]: raise HTTPException(status_code=403, detail="Admin only")
              return user

          class SignupModel(BaseModel):
              email: str; username: str; password: str; name: Optional[str] = ""
          class LoginModel(BaseModel):
              identifier: str; password: str
          class PostCreate(BaseModel):
              text: Optional[str] = ""; media_ids: Optional[List[str]] = None; parent_id: Optional[int] = None; quoted_post_id: Optional[int] = None
          class PostUpdate(BaseModel):
              text: Optional[str] = None; media_ids: Optional[List[str]] = None
          class UserUpdate(BaseModel):
              name: Optional[str] = None; bio: Optional[str] = None; username: Optional[str] = None; email: Optional[str] = None; password: Optional[str] = None; profile_image_ids: Optional[List[str]] = None; profile_music_ids: Optional[List[str]] = None
          class ConversationCreate(BaseModel):
              user_ids: List[int]; name: Optional[str] = None; is_group: bool = False
          class MessageCreate(BaseModel):
              text: Optional[str] = ""; media_ids: Optional[List[str]] = None; reply_to_id: Optional[int] = None
          class MessageUpdate(BaseModel):
              text: str
          class AddMemberModel(BaseModel):
              user_id: int
          class AdminVerifyModel(BaseModel):
              verified: bool = True
          class StoryCreate(BaseModel):
              media_id: Optional[str] = None; text: Optional[str] = ""

          def classify_media(content_type, filename):
              ct = (content_type or "").lower()
              ext = Path(filename or "").suffix.lower()
              if ct.startswith("image/") or ext in [".jpg", ".jpeg", ".png", ".webp", ".bmp"]: return "gif" if ct == "image/gif" or ext == ".gif" else "image"
              if ct.startswith("video/") or ext in [".mp4", ".mov", ".webm", ".mkv", ".avi"]: return "video"
              if ct.startswith("audio/") or ext in [".mp3", ".wav", ".ogg", ".m4a", ".flac"]: return "audio"
              return "file"

          def make_thumbnail(media_id, path, media_type):
              thumb_name = f"{media_id}.jpg"
              thumb_path = THUMB_DIR / thumb_name
              try:
                  if media_type in ("image", "gif"):
                      from PIL import Image
                      img = Image.open(path)
                      if getattr(img, "is_animated", False): img.seek(0)
                      if img.mode in ("RGBA", "P", "LA"): img = img.convert("RGB")
                      img.thumbnail((480, 480))
                      img.save(thumb_path, "JPEG", quality=82)
                      return thumb_name
                  if media_type == "video":
                      cmd = ["ffmpeg", "-y", "-i", str(path), "-ss", "00:00:01", "-vframes", "1", "-vf", "scale=480:-2", str(thumb_path)]
                      subprocess.run(cmd, capture_output=True, timeout=45)
                      if thumb_path.exists(): return thumb_name
              except: pass
              return None

          def media_row_to_dict(row):
              return {"id": row["id"], "url": f"/media/{row['filename']}", "thumbnail": f"/thumbs/{row['thumbnail']}" if row["thumbnail"] else None, "mime_type": row["mime_type"], "media_type": row["media_type"], "original_name": row["original_name"], "title": row["title"] if "title" in row.keys() else None, "artist": row["artist"] if "artist" in row.keys() else None, "duration": row["duration"] if "duration" in row.keys() else None, "created_at": row["created_at"]}

          def get_user_media(user_id, media_type):
              rows = query("SELECT m.* FROM media m JOIN user_media um ON um.media_id = m.id WHERE um.user_id=? AND um.type=? ORDER BY um.position", (user_id, media_type))
              return [media_row_to_dict(r) for r in rows]

          def set_user_media(user_id, media_type, media_ids):
              execute("DELETE FROM user_media WHERE user_id=? AND type=?", (user_id, media_type))
              if not media_ids: return
              for i, media_id in enumerate(media_ids): execute("INSERT OR IGNORE INTO user_media(user_id, media_id, type, position) VALUES(?,?,?,?)", (user_id, media_id, media_type, i))

          def follower_count(user_id):
              row = query_one("SELECT COUNT(*) AS c FROM follows WHERE followee_id=?", (user_id,))
              return row["c"] if row else 0

          def following_count(user_id):
              row = query_one("SELECT COUNT(*) AS c FROM follows WHERE follower_id=?", (user_id,))
              return row["c"] if row else 0

          def has_unseen_story(user_id, current_user_id):
              if not current_user_id or user_id == current_user_id: return False
              active = query_one("SELECT id FROM stories WHERE user_id=? AND expires_at > ? LIMIT 1", (user_id, now_iso()))
              if not active: return False
              unseen = query_one("SELECT COUNT(*) as c FROM stories s WHERE s.user_id=? AND s.expires_at > ? AND s.id NOT IN (SELECT story_id FROM story_views WHERE user_id=?)", (user_id, now_iso(), current_user_id))
              return unseen["c"] > 0 if unseen else False

          def user_dict(row, current_user=None, include_email=False):
              if not row: return None
              d = {"id": row["id"], "username": row["username"], "name": row["name"] or row["username"], "bio": row["bio"] or "", "is_verified": bool(row["is_verified"]), "is_admin": bool(row["is_admin"]), "created_at": row["created_at"], "last_seen": row["last_seen"], "online": is_online(row["last_seen"]), "followers_count": follower_count(row["id"]), "following_count": following_count(row["id"]), "profile_images": get_user_media(row["id"], "profile_image"), "profile_music": get_user_media(row["id"], "profile_music"), "has_unseen_story": has_unseen_story(row["id"], current_user["id"] if current_user else None)}
              if current_user and (include_email or current_user["id"] == row["id"] or current_user["is_admin"]): d["email"] = row["email"]
              if current_user:
                  d["following"] = bool(query_one("SELECT 1 FROM follows WHERE follower_id=? AND followee_id=?", (current_user["id"], row["id"])))
                  if current_user["id"] != row["id"]:
                      followed_by = query("SELECT u.username FROM follows f JOIN users u ON u.id = f.follower_id JOIN follows my_follows ON my_follows.follower_id = ? AND my_follows.followee_id = f.follower_id WHERE f.followee_id = ? AND f.follower_id != ? LIMIT 3", (current_user["id"], row["id"], current_user["id"]))
                      d["followed_by_followings"] = [r["username"] for r in followed_by]
              return d

          def get_post_row(post_id): return query_one("SELECT * FROM posts WHERE id=?", (post_id,))

          def attach_post_media(post_id, media_ids):
              execute("DELETE FROM post_media WHERE post_id=?", (post_id,))
              if not media_ids: return
              for i, media_id in enumerate(media_ids): execute("INSERT OR IGNORE INTO post_media(post_id, media_id, position) VALUES(?,?,?)", (post_id, media_id, i))

          def post_media(post_id):
              rows = query("SELECT m.* FROM media m JOIN post_media pm ON pm.media_id = m.id WHERE pm.post_id=? ORDER BY pm.position", (post_id,))
              return [media_row_to_dict(r) for r in rows]

          def post_dict(row, current_user=None, depth=0):
              if not row: return None
              post_id = row["id"]
              user = query_one("SELECT * FROM users WHERE id=?", (row["user_id"],))
              likes = query_one("SELECT COUNT(*) AS c FROM likes WHERE post_id=?", (post_id,))["c"]
              replies = query_one("SELECT COUNT(*) AS c FROM posts WHERE parent_id=?", (post_id,))["c"]
              retweets = query_one("SELECT COUNT(*) AS c FROM retweets WHERE post_id=?", (post_id,))["c"]
              quotes = query_one("SELECT COUNT(*) AS c FROM posts WHERE quoted_post_id=?", (post_id,))["c"]
              bookmarks = query_one("SELECT COUNT(*) AS c FROM bookmarks WHERE post_id=?", (post_id,))["c"]
              shares = query_one("SELECT COUNT(*) AS c FROM shares WHERE post_id=?", (post_id,))["c"]
              d = {"id": post_id, "text": row["text"], "created_at": row["created_at"], "edited_at": row["edited_at"], "user": user_dict(user, current_user) if user else None, "media": post_media(post_id), "likes_count": likes, "replies_count": replies, "retweets_count": retweets, "quotes_count": quotes, "bookmarks_count": bookmarks, "shares_count": shares, "parent_id": row["parent_id"], "quoted_post_id": row["quoted_post_id"], "repost_of_id": row["repost_of_id"]}
              if current_user:
                  d["liked"] = bool(query_one("SELECT 1 FROM likes WHERE user_id=? AND post_id=?", (current_user["id"], post_id)))
                  d["bookmarked"] = bool(query_one("SELECT 1 FROM bookmarks WHERE user_id=? AND post_id=?", (current_user["id"], post_id)))
                  d["retweeted"] = bool(query_one("SELECT 1 FROM retweets WHERE user_id=? AND post_id=?", (current_user["id"], post_id)))
                  liked_by = query("SELECT u.username FROM likes l JOIN users u ON u.id = l.user_id JOIN follows f ON f.follower_id = ? AND f.followee_id = l.user_id WHERE l.post_id = ? AND l.user_id != ? LIMIT 3", (current_user["id"], post_id, current_user["id"]))
                  d["liked_by_followings"] = [r["username"] for r in liked_by]
                  reposted_by = query("SELECT u.username FROM retweets r JOIN users u ON u.id = r.user_id JOIN follows f ON f.follower_id = ? AND f.followee_id = r.user_id WHERE r.post_id = ? AND r.user_id != ? LIMIT 3", (current_user["id"], post_id, current_user["id"]))
                  d["reposted_by_followings"] = [r["username"] for r in reposted_by]
              if depth < 1:
                  if row["quoted_post_id"]:
                      quoted = get_post_row(row["quoted_post_id"])
                      d["quoted_post"] = post_dict(quoted, current_user, depth + 1) if quoted else None
                  if row["repost_of_id"]:
                      repost = get_post_row(row["repost_of_id"])
                      d["repost_of"] = post_dict(repost, current_user, depth + 1) if repost else None
              return d

          def notify(user_id, actor_id, ntype, post_id=None, message_id=None, text=None):
              if not user_id or user_id == actor_id: return
              execute("INSERT INTO notifications(user_id, actor_id, type, post_id, message_id, text, read, created_at) VALUES(?,?,?,?,?,?,0,?)", (user_id, actor_id, ntype, post_id, message_id, text, now_iso()))

          def notify_mentions(text, actor_id, post_id=None, message_id=None):
              if not text: return
              for username in set(re.findall(r"@([A-Za-z0-9_]+)", text)):
                  user = query_one("SELECT id FROM users WHERE username=?", (username,))
                  if user: notify(user["id"], actor_id, "mention", post_id, message_id, text)

          def story_dict(row, current_user=None):
              if not row: return None
              media = None
              if row["media_id"]:
                  m = query_one("SELECT * FROM media WHERE id=?", (row["media_id"],))
                  if m: media = media_row_to_dict(m)
              viewed = False
              viewers_count = 0
              if current_user:
                  v = query_one("SELECT 1 FROM story_views WHERE story_id=? AND user_id=?", (row["id"], current_user["id"]))
                  viewed = bool(v)
                  viewers_count = query_one("SELECT COUNT(*) as c FROM story_views WHERE story_id=?", (row["id"],))["c"]
              return {"id": row["id"], "user_id": row["user_id"], "media": media, "text": row["text"], "created_at": row["created_at"], "expires_at": row["expires_at"], "viewed_by_me": viewed, "viewers_count": viewers_count}

          def message_dict(row, current_user=None):
              if not row: return None
              sender = query_one("SELECT * FROM users WHERE id=?", (row["sender_id"],))
              media_rows = query("SELECT m.* FROM media m JOIN message_media mm ON mm.media_id = m.id WHERE mm.message_id=?", (row["id"],))
              reads = query("SELECT user_id, read_at FROM message_reads WHERE message_id=?", (row["id"],))
              reply_to_msg = None
              if row["reply_to_id"]:
                  r_msg = query_one("SELECT * FROM messages WHERE id=?", (row["reply_to_id"],))
                  if r_msg: reply_to_msg = {"id": r_msg["id"], "sender_id": r_msg["sender_id"], "text": "" if r_msg["deleted"] else r_msg["text"], "deleted": bool(r_msg["deleted"])}
              return {"id": row["id"], "conversation_id": row["conversation_id"], "sender": user_dict(sender, current_user) if sender else None, "text": "" if row["deleted"] else row["text"], "created_at": row["created_at"], "edited_at": row["edited_at"], "deleted": bool(row["deleted"]), "reply_to_id": row["reply_to_id"], "reply_to": reply_to_msg, "media": [media_row_to_dict(r) for r in media_rows], "read_by": [{"user_id": r["user_id"], "read_at": r["read_at"]} for r in reads]}

          def ensure_member(conversation_id, user):
              member = query_one("SELECT * FROM conversation_members WHERE conversation_id=? AND user_id=?", (conversation_id, user["id"]))
              if not member: raise HTTPException(status_code=403, detail="Not a member")
              return member

          def conversation_dict(conversation_id, current_user):
              conv = query_one("SELECT * FROM conversations WHERE id=?", (conversation_id,))
              if not conv: return None
              members = query("SELECT u.* FROM users u JOIN conversation_members cm ON cm.user_id = u.id WHERE cm.conversation_id=?", (conversation_id,))
              last_message = query_one("SELECT * FROM messages WHERE conversation_id=? ORDER BY id DESC LIMIT 1", (conversation_id,))
              member = query_one("SELECT * FROM conversation_members WHERE conversation_id=? AND user_id=?", (conversation_id, current_user["id"]))
              unread = 0
              if member: unread = query_one("SELECT COUNT(*) AS c FROM messages WHERE conversation_id=? AND id > ? AND sender_id != ? AND deleted=0", (conversation_id, member["last_read_message_id"] or 0, current_user["id"]))["c"]
              return {"id": conv["id"], "is_group": bool(conv["is_group"]), "name": conv["name"], "created_by": conv["created_by"], "created_at": conv["created_at"], "members": [user_dict(r, current_user) for r in members], "last_message": message_dict(last_message, current_user) if last_message else None, "unread_count": unread}

          def find_direct_conversation(uid1, uid2):
              rows = query("SELECT DISTINCT conversation_id FROM conversation_members WHERE user_id IN (?,?)", (uid1, uid2))
              for r in rows:
                  conv = query_one("SELECT * FROM conversations WHERE id=? AND is_group=0", (r["conversation_id"],))
                  if not conv: continue
                  members = query("SELECT user_id FROM conversation_members WHERE conversation_id=?", (conv["id"],))
                  ids = {m["user_id"] for m in members}
                  if len(ids) == 2 and ids == {uid1, uid2}: return conv
              return None

