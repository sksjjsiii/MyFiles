                  updates.append("username=?"); params.append(payload.username)
              if payload.email is not None:
                  if not re.match(r"^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$", payload.email): raise HTTPException(400, "Invalid email")
                  if query_one("SELECT id FROM users WHERE email=? AND id != ?", (payload.email, user["id"])): raise HTTPException(400, "Email exists")
                  updates.append("email=?"); params.append(payload.email)
