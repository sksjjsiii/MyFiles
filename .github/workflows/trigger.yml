name: Trigger Main Workflow

o.n:
  workflow_run:
    workflows: ["Forever Bot"]
    types:
      - comple.ted

permissions: write-all

concurrency:
  group: trigger-main
  cancel-in-progress: false

jobs:
  trigger:
    if: ${{ github.event.workflow_run.conclusion != 'cancelled' }}
    runs-on: ubuntu-latest

    steps:
      - name: Delay to reduce GitHub API pressure
        run: sleep 60

      - name: Call GitHub API to re-run main workflow
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          BRANCH="${{ github.event.workflow_run.head_branch }}"

          if [ -z "$BRANCH" ]; then
            BRANCH="main"
          fi

          echo "Re-triggering TGBOT.yml on branch $BRANCH"

          curl -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $PAT_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/TGBOT.yml/dispatches" \
            -d "{\"ref\":\"$BRANCH\"}"