name: Windows RDP with bore (Auto-Update README)

on:
  workflow_dispatch:
    inputs:
      session_minutes:
        description: 'Duration in minutes'
        required: true
        default: '120'

jobs:
  rdp-tunnel:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable RDP and create user
        shell: powershell
        run: |
          reg add "HKLM\System\CurrentControlSet\Control\Terminal Server" /v fDenyTSConnections /t REG_DWORD /d 0 /f
          netsh advfirewall firewall set rule group="Remote Desktop" new enable=yes
          reg add "HKLM\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v UserAuthentication /t REG_DWORD /d 0 /f

          # --- غیرفعال کردن سیاست پیچیدگی پسورد (روش ۱: secedit) ---
          $secPolLines = @(
            '[Unicode]',
            'Unicode=yes',
            '[System Access]',
            'MinimumPasswordLength = 0',
            'PasswordComplexity = 0',
            'PasswordHistorySize = 0',
            'MaximumPasswordAge = -1',
            'MinimumPasswordAge = 0'
          )
          $infPath = "$env:TEMP\secpol.inf"
          $secPolLines -join "`r`n" | Out-File -FilePath $infPath -Encoding unicode
          secedit /configure /db "$env:TEMP\secpol.sdb" /cfg $infPath /areas SECURITYPOLICY /quiet
          Remove-Item $infPath -Force -ErrorAction SilentlyContinue
          Write-Host "Password complexity policy disabled via secedit."

          # --- غیرفعال کردن سیاست پیچیدگی پسورد (روش ۲: رجیستری مستقیم) ---
          $regPath = "HKLM:\SYSTEM\CurrentControlSet\Control\Lsa"
          Set-ItemProperty -Path $regPath -Name "PasswordComplexity" -Value 0 -Type DWord -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path $regPath -Name "LimitBlankPasswordUse" -Value 0 -Type DWord -Force -ErrorAction SilentlyContinue
          Write-Host "Registry password complexity overridden."

          # --- بررسی سیاست اعمال‌شده ---
          secedit /export /cfg "$env:TEMP\verify.cfg" /areas SECURITYPOLICY 2>&1 | Out-Null
          $cfg = Get-Content "$env:TEMP\verify.cfg" -Raw -ErrorAction SilentlyContinue
          if ($cfg -match 'PasswordComplexity\s*=\s*(\d)') {
            Write-Host "Current PasswordComplexity = $($matches[1])"
          }
          Remove-Item "$env:TEMP\verify.cfg" -Force -ErrorAction SilentlyContinue

          # --- ساخت کاربر RDP ---
          $username = "rdpuser"
          $password = "${{ secrets.RDP_PASSWORD }}"

          if ([string]::IsNullOrWhiteSpace($password)) {
            Write-Host "ERROR: RDP_PASSWORD secret is empty. Please set it in GitHub Secrets."
            exit 1
          }

          if ($password.Length -lt 6) {
            Write-Host "ERROR: Password must be at least 6 characters long."
            exit 1
          }

          # حذف کاربر قبلی در صورت وجود
          $existing = Get-LocalUser -Name $username -ErrorAction SilentlyContinue
          if ($existing) {
            Remove-LocalUser -Name $username -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 2
          }

          # --- روش ۱: net user (API متفاوت، احتمال موفقیت بالاتر) ---
          Write-Host "Attempting to create user with 'net user'..."
          $netResult = net user $username $password /add /passwordchg:no /expires:never 2>&1
          if ($LASTEXITCODE -eq 0) {
            Write-Host "User '$username' created via 'net user'."
          } else {
            Write-Host "net user failed (exit $LASTEXITCODE): $netResult"
            Write-Host "Trying New-LocalUser as fallback..."

            # --- روش ۲: New-LocalUser به عنوان fallback ---
            try {
              $securePass = ConvertTo-SecureString $password -AsPlainText -Force
              New-LocalUser -Name $username -Password $securePass -FullName "Remote Desktop User" `
                -PasswordNeverExpires -AccountNeverExpires -ErrorAction Stop
              Write-Host "User '$username' created via New-LocalUser."
            } catch {
              Write-Host "New-LocalUser also failed: $($_.Exception.Message)"

              # --- روش ۳: WMI/ADSI به عنوان آخرین راه‌حل ---
              Write-Host "Trying ADSI/WMI Win32_UserAccount..."
              try {
                $computer = [ADSI]"WinNT://$env:COMPUTERNAME"
                $newUser = $computer.Create("User", $username)
                $newUser.SetPassword($password)
                $newUser.SetInfo()
                $newUser.Description = "Remote Desktop User"
                $newUser.SetInfo()
                $newUser.UserFlags = 0x10000  # DONT_EXPIRE_PASSWD
                $newUser.SetInfo()
                Write-Host "User '$username' created via ADSI/WMI."
              } catch {
                Write-Host "All methods failed: $($_.Exception.Message)"
                exit 1
              }
            }
          }

          # --- اضافه کردن به گروه‌ها ---
          try {
            Add-LocalGroupMember -Group "Administrators" -Member $username -ErrorAction SilentlyContinue
            Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username -ErrorAction SilentlyContinue
            Write-Host "User '$username' added to Administrators and Remote Desktop Users."
          } catch {
            Write-Host "Warning: Could not add to some groups: $($_.Exception.Message)"
          }

          # --- تأیید نهایی ---
          $finalUser = Get-LocalUser -Name $username -ErrorAction SilentlyContinue
          if ($finalUser) {
            Write-Host "SUCCESS: User '$username' exists. Enabled: $($finalUser.Enabled)"
          } else {
            Write-Host "ERROR: User '$username' was not created!"
            exit 1
          }

          Get-Service TermService | Start-Service
          Set-Service -Name TermService -StartupType Automatic

      - name: Download bore.exe
        shell: powershell
        run: |
          $url = "https://github.com/ekzhang/bore/releases/latest/download/bore-x86_64-pc-windows-msvc.zip"
          Invoke-WebRequest -Uri $url -OutFile "bore.zip" -UseBasicParsing
          Expand-Archive -Path "bore.zip" -DestinationPath "." -Force
          if (Test-Path ".\bore.exe") {
            Write-Host "bore.exe downloaded successfully."
          } else {
            Write-Host "ERROR: bore.exe not found after extraction."
            Get-ChildItem
            exit 1
          }

      - name: Create bore runner script
        shell: powershell
        run: |
          $lines = @(
            '$outLog = "bore_out.log"',
            '$errLog = "bore_err.log"',
            '$tunnelHost = "bore.pub"',
            '',
            'function Start-Bore {',
            '  if (Test-Path $outLog) { Remove-Item $outLog -Force }',
            '  if (Test-Path $errLog) { Remove-Item $errLog -Force }',
            '  Start-Process -NoNewWindow -FilePath ".\bore.exe" -ArgumentList "local","3389","--to","bore.pub" -RedirectStandardOutput $outLog -RedirectStandardError $errLog',
            '  Start-Sleep -Seconds 10',
            '  $raw = Get-Content $outLog -Raw -ErrorAction SilentlyContinue',
            '  if (-not $raw) {',
            '    Write-Host "No stdout yet. Trying stderr..."',
            '    $raw = Get-Content $errLog -Raw -ErrorAction SilentlyContinue',
            '  }',
            '  $clean = $raw -replace "\x1b\[[0-9;]*m", ""',
            '  Write-Host "Bore output: $clean"',
            '  if ($clean -match "listening at [\w\.]+:(\d+)") {',
            '    $port = $matches[1]',
            '    $connectionInfo = "host=$tunnelHost`nport=$port"',
            '    $connectionInfo | Out-File -FilePath connection.txt -Encoding utf8',
            '    Write-Host "Tunnel established on port $port"',
            '    return $port',
            '  }',
            '  return $null',
            '}',
            '',
            '# Keep-alive probe every 30s',
            'Start-Job -ScriptBlock {',
            '  while ($true) {',
            '    try { $tcp = New-Object Net.Sockets.TcpClient; $tcp.Connect("127.0.0.1", 3389); $tcp.Close() } catch { }',
            '    Start-Sleep -Seconds 30',
            '  }',
            '} | Out-Null',
            '',
            '# Start bore for the first time',
            '$currentPort = Start-Bore',
            'if (-not $currentPort) {',
            '  Write-Host "ERROR: Could not start bore."',
            '  exit 1',
            '}',
            '',
            '# Monitor loop',
            'while ($true) {',
            '  Start-Sleep -Seconds 30',
            '  $boreProc = Get-Process -Name "bore" -ErrorAction SilentlyContinue',
            '  if (-not $boreProc) {',
            '    Write-Host "Bore stopped. Restarting..."',
            '    $currentPort = Start-Bore',
            '  }',
            '}'
          )
          $lines | Out-File -FilePath bore_runner.ps1 -Encoding utf8
          Write-Host "bore_runner.ps1 created."

      - name: Start bore tunnel (detached)
        shell: powershell
        run: |
          Start-Process -FilePath "powershell.exe" -ArgumentList "-ExecutionPolicy","Bypass","-File","bore_runner.ps1" -WindowStyle Hidden
          Write-Host "Bore runner started in background."

          Write-Host "Waiting for tunnel to be ready..."
          for ($i=0; $i -lt 60; $i++) {
            if (Test-Path "connection.txt") { break }
            Start-Sleep -Seconds 1
          }
          if (Test-Path "connection.txt") {
            Write-Host "Tunnel is ready."
            Get-Content connection.txt
          } else {
            Write-Host "WARNING: Tunnel may not have started. Will try to continue."
            if (Test-Path "bore_out.log") { Write-Host "--- bore_out.log ---"; Get-Content "bore_out.log" }
            if (Test-Path "bore_err.log") { Write-Host "--- bore_err.log ---"; Get-Content "bore_err.log" }
          }

      - name: Update README.md
        shell: powershell
        run: |
          if (-not (Test-Path "connection.txt")) {
            Write-Host "ERROR: connection.txt not found."
            exit 1
          }

          $details = Get-Content connection.txt -Raw | ConvertFrom-StringData
          $connectionString = "$($details.host):$($details.port)"

          $username = "rdpuser"
          $expiry = (Get-Date).AddMinutes(${{ github.event.inputs.session_minutes }}).ToString('yyyy-MM-dd HH:mm:ss') + ' UTC'

          $newSection = "## Windows RDP Access`r`n"
          $newSection += "**Connection Address:** ``$connectionString``  `r`n"
          $newSection += "**Username:** ``$username``  `r`n"
          $newSection += "**Password:** (stored in GitHub Secrets)  `r`n"
          $newSection += "**Expires:** $expiry  `r`n"

          if (-not (Test-Path "README.md")) {
            $readmeContent = $newSection
          } else {
            $readmeContent = Get-Content "README.md" -Raw -ErrorAction SilentlyContinue
            if ($readmeContent -match '## Windows RDP Access') {
              $readmeContent = $readmeContent -replace '(?s)## Windows RDP Access.*', $newSection
            } else {
              $readmeContent += "`r`n$newSection"
            }
          }

          $readmeContent | Out-File -FilePath "README.md" -Encoding utf8
          Write-Host "README.md updated."

      - name: Commit and push README.md
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update RDP access info [skip ci]" --allow-empty
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Display connection info
        shell: powershell
        run: |
          $details = Get-Content connection.txt -Raw | ConvertFrom-StringData

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "  WINDOWS RDP READY FOR ANDROID"
          Write-Host "======================================================"
          Write-Host "  Host: $($details.host)"
          Write-Host "  Port: $($details.port)"
          Write-Host "  Username: rdpuser"
          Write-Host "  Password: (your secret)"
          Write-Host "======================================================"
          Write-Host ""
          Write-Host "In Microsoft Remote Desktop on Android:"
          Write-Host "  PC Name: $($details.host):$($details.port)"
          Write-Host "  User Name: rdpuser"
          Write-Host ""
          Write-Host "This info is also in README.md at the root of the repo."

      - name: Keep session alive
        shell: powershell
        run: |
          $duration = [int]${{ github.event.inputs.session_minutes }}
          $endTime = (Get-Date).AddMinutes($duration)

          Write-Host "Session will stay active for $duration minutes."
          while ((Get-Date) -lt $endTime) {
            $remaining = ($endTime - (Get-Date)).ToString("hh\:mm\:ss")
            Write-Host "Remaining $remaining | $(Get-Date -Format 'HH:mm:ss')"
            Start-Sleep -Seconds 60
          }
          Write-Host "Time is up."