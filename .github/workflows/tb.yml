name: Telegram OUO Bypass Bot (Async)

on:
  workflow_dispatch:  # اجرای دستی

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-telegram-bot==20.7 curl_cffi beautifulsoup4 lxml requests

      - name: Run Telegram Bot
        env:
          TOKEN: ${{ secrets.TOKEN }}   # توکن از secret
        run: python bot.py