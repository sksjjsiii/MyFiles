name: Telegram OUO Bypass Bot

on:
  workflow_dispatch:          # اجرای دستی

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install bypass-ouo pyTelegramBotAPI

      - name: Run Telegram bot
        env:
          TOKEN: ${{ secrets.TOKEN }}   # توکن از secret
        run: |
          # ایجاد فایل bot.py با استفاده از printf (بدون مشکل indentation)
          printf 'import os\nimport re\nimport telebot\nfrom bypass_ouo import bypass_ouo\n\nTOKEN = os.environ.get("TOKEN")\nif not TOKEN:\n    raise ValueError("متغیر محیطی TOKEN تنظیم نشده است.")\n\nbot = telebot.TeleBot(TOKEN)\n\n@bot.message_handler(func=lambda message: True)\ndef handle_message(message):\n    try:\n        text = message.text\n        if not text:\n            bot.reply_to(message, "❌ لطفاً یک متن ارسال کنید.")\n            return\n        ouo_pattern = r"(https?://(?:ouo\\.io|ouo\\.press)/[^\\s]+)"\n        matches = re.findall(ouo_pattern, text)\n        if not matches:\n            bot.reply_to(message, "ℹ️ لینک ouo معتبری در پیام یافت نشد.")\n            return\n        target_url = matches[0]\n        bot.reply_to(message, f"⏳ در حال پردازش لینک:\\n{target_url}")\n        bypassed = bypass_ouo(target_url)\n        if bypassed:\n            bot.reply_to(message, f"✅ لینک نهایی:\\n{bypassed}")\n        else:\n            bot.reply_to(message, "⚠️ امکان bypass کردن لینک وجود نداشت.")\n    except Exception as e:\n        error_msg = f"❌ خطا:\\n{str(e)}"\n        bot.reply_to(message, error_msg)\n\nif __name__ == "__main__":\n    print("ربات شروع به کار کرد...")\n    bot.infinity_polling()\n' > bot.py

          # اجرای ربات
          python bot.py