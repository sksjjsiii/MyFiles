name: Telegram OUO Bypass Bot

on:
  workflow_dispatch:      # اجرای دستی توسط کاربر

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install bypass-ouo pyTelegramBotAPI

      - name: Run Telegram bot
        env:
          TOKEN: ${{ secrets.TOKEN }}   # توکن از secret
        run: |
          # ایجاد فایل موقت bot.py با کد ربات
          cat > bot.py << 'EOF'
import os
import re
import telebot
from bypass_ouo import bypass_ouo

TOKEN = os.environ.get('TOKEN')
if not TOKEN:
    raise ValueError('متغیر محیطی TOKEN تنظیم نشده است.')

bot = telebot.TeleBot(TOKEN)

@bot.message_handler(func=lambda message: True)
def handle_message(message):
    try:
        text = message.text
        if not text:
            bot.reply_to(message, '❌ لطفاً یک متن ارسال کنید.')
            return

        # استخراج اولین لینک ouo از پیام
        ouo_pattern = r'(https?://(?:ouo\.io|ouo\.press)/[^\s]+)'
        matches = re.findall(ouo_pattern, text)
        if not matches:
            bot.reply_to(message, 'ℹ️ لینک ouo معتبری در پیام یافت نشد.')
            return

        target_url = matches[0]
        bot.reply_to(message, f'⏳ در حال پردازش لینک:\n{target_url}')

        # استفاده از پکیج bypass-ouo
        bypassed = bypass_ouo(target_url)
        if bypassed:
            bot.reply_to(message, f'✅ لینک نهایی:\n{bypassed}')
        else:
            bot.reply_to(message, '⚠️ امکان bypass کردن لینک وجود نداشت.')

    except Exception as e:
        # ارسال تمام جزئیات خطا به کاربر
        error_msg = f'❌ خطا:\n{str(e)}'
        bot.reply_to(message, error_msg)

if __name__ == '__main__':
    print('ربات شروع به کار کرد...')
    bot.infinity_polling()
EOF
          # اجرای ربات
          python bot.py