name: pulse_social
description: "NokhodX — a modern Twitter-like + Reels social app."
publish_to: "none"
version: 4.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.1
  shared_preferences: ^2.2.3
  cached_network_image: ^3.3.1
  video_player: ^2.8.6
  shimmer: ^3.0.0
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  provider: ^6.1.2
  photo_view: ^0.15.0
  audioplayers: ^6.1.0
  file_picker: ^8.1.2
  mime: ^1.0.5
  path_provider: ^2.1.2
  open_file: ^3.3.2
  permission_handler: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true